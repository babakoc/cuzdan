<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cüzdan">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Cüzdan</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --text:#0B0B12; --muted:#8B8B96; --line:rgba(60,60,67,.12);
  --accent:#4C5BFF; --pos:#12A26B; --neg:#E5484D; --chip:#EDEDF2;
  --hero1:#151A3B; --hero2:#3A2E7A; --hero3:#0E6E5C;
  --bar:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,20,40,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --card:#141418; --card2:#1C1C22; --text:#F4F4F7; --muted:#8E8E99; --line:rgba(255,255,255,.08);
  --accent:#7C87FF; --pos:#3DD68C; --neg:#FF6B6E; --chip:#23232B; --bar:rgba(20,20,24,.72); --shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;font-size:17px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#view{padding:8px 16px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header.big{padding:14px 2px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.big h1{font-size:34px;letter-spacing:-.02em;margin:0;font-weight:750}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--accent)}
.icon-btn svg{width:20px;height:20px}

.hero{border-radius:26px;padding:22px 22px 18px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,var(--hero2) 0%,transparent 55%),radial-gradient(120% 120% at 0% 100%,var(--hero3) 0%,transparent 55%),var(--hero1)}
.hero .label{font-size:13px;opacity:.7;font-weight:600}
.hero .big-amt{font-size:38px;font-weight:750;letter-spacing:-.03em;margin:4px 0 16px}
.hero .big-amt small{font-size:20px;opacity:.6;font-weight:600}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-row div{background:rgba(255,255,255,.09);border-radius:16px;padding:10px 12px}
.hero-row span{display:block;font-size:12px;opacity:.65}
.hero-row b{font-size:17px;font-weight:650}

.month{display:flex;align-items:center;justify-content:center;gap:6px;margin:20px 0 12px}
.month button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.month button:disabled{opacity:.3}
.month span{min-width:150px;text-align:center;font-weight:650;font-size:17px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.tile b{display:block;font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.hero-row b+span{margin-top:3px;font-size:11px;opacity:.75}
.hero-row em{font-style:normal;font-weight:700}
.hero-row em.late{color:#FF8A8D}
.hero-btn{display:block;width:100%;height:44px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;margin-top:12px}
.hero-hint{display:block;color:#fff;opacity:.8;font-weight:600;font-size:14px;text-align:left}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;font-size:16px;margin:0 0 4px -4px}
.row-actions{display:flex;gap:8px;padding:0 14px 12px 62px}
.row-actions button{flex:1;height:36px;border-radius:10px;background:var(--chip);font-weight:650;font-size:14px}
.row-actions button.on{background:var(--accent);color:#fff}
.empty p{margin:0 0 20px;line-height:1.5}
.ic{overflow:hidden}
.ico-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.ico-img.inline{width:18px;height:18px;border-radius:5px;display:inline-block;vertical-align:-4px}
.tx-icon{display:flex;flex-direction:column;align-items:center;gap:5px;margin:2px auto -4px}
.tx-icon .ic-big{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;overflow:hidden}
.tx-icon small{font-size:12px;color:var(--accent);font-weight:600}
.ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-bottom:18px}
.ico-tile{aspect-ratio:1;border-radius:13px;background:var(--card);display:grid;place-items:center;font-size:25px;position:relative;overflow:hidden}
.ico-tile.on{box-shadow:inset 0 0 0 2.5px var(--accent)}
.ico-tile.add{color:var(--accent);font-size:26px;border:1.5px dashed var(--muted);background:none}
.ico-tile.del i{position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:var(--neg);color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center}
.custom-emoji{display:flex;gap:8px;margin-bottom:18px}
.custom-emoji input{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:var(--card);padding:0 12px;outline:none}
.custom-emoji button{padding:0 16px;border-radius:12px;background:var(--chip);font-weight:650}
.sub-label.between{display:flex;justify-content:space-between;align-items:center}
.sub-label button{color:var(--accent);font-weight:600;text-transform:none;letter-spacing:0;font-size:14px}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.card h3,.sec-title{margin:0 0 12px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-title{margin:24px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title small{font-size:13px;color:var(--muted);font-weight:600}
.sec-title a{font-size:15px;color:var(--accent);font-weight:600}

.donut-wrap{display:flex;gap:16px;align-items:center}
.donut{flex:0 0 132px;position:relative}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c span{font-size:11px;color:var(--muted);font-weight:600}
.donut .c b{font-size:15px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.legend .r{display:flex;align-items:center;gap:8px;font-size:14px;text-align:left;width:100%}
.legend .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.legend .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .p{color:var(--muted);font-size:13px}

.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .col{width:100%;max-width:34px;display:flex;gap:3px;align-items:flex-end;height:100%}
.bars .col i{flex:1;border-radius:6px 6px 3px 3px;background:var(--chip);min-height:3px}
.bars .col i.e{background:var(--neg);opacity:.85} .bars .col i.g{background:var(--pos);opacity:.85}
.bars .b.cur span{color:var(--text);font-weight:700}
.bars span{font-size:11px;color:var(--muted);font-weight:600}
.bar-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.bar-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line)}
.row.nested{padding-left:30px}
.row.nested+.row::before,.row+.row.nested::before{left:62px}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:560;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{text-align:right;font-weight:620;white-space:nowrap}
.row .a small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px}
.meter{height:4px;border-radius:2px;background:var(--chip);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
.day{display:flex;justify-content:space-between;margin:18px 6px 6px;font-size:13px;color:var(--muted);font-weight:650}
.chev{color:var(--muted);opacity:.5;width:8px}

.search{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px;height:40px;margin:4px 0 6px}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.search svg{width:16px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:42px;margin-bottom:8px}
.welcome{text-align:center;padding:40px 18px}
.welcome h2{font-size:26px;margin:16px 0 8px;letter-spacing:-.02em}
.welcome p{color:var(--muted);margin:0 0 22px}

.primary{display:block;width:100%;height:52px;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:17px}
.secondary{display:block;width:100%;height:48px;border-radius:14px;background:var(--chip);font-weight:650;margin-top:10px}
.danger{color:var(--neg)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .fab{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(76,91,255,.4);margin-top:-18px}
nav.tabs .fab svg{width:26px;height:26px}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;
  min-height:72vh;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
body.sheet-open #scrim{opacity:1;pointer-events:auto}
body.sheet-open #sheet{transform:none}
body.sheet-open{overflow:hidden}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:20px}
.sheet-head button{color:var(--accent);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{height:34px;border-radius:9px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 18px}
.amount input{border:0;background:none;outline:none;font-size:46px;font-weight:750;text-align:right;width:2ch;max-width:78%;letter-spacing:-.03em;padding:0}
.amount span{font-size:28px;color:var(--muted);font-weight:700}
.form{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:14px}
.field{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:50px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.field label{flex:0 0 96px;color:var(--muted);font-size:15px}
.field input,.field select{flex:1;border:0;background:none;outline:none;min-width:0;text-align:right;height:48px;-webkit-appearance:none;appearance:none}
.field select{direction:rtl}
.field input[type=checkbox]{flex:0 0 auto;width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cats .chip{display:flex;align-items:center;gap:6px}
.sub-label{font-size:13px;color:var(--muted);font-weight:650;margin:0 4px 8px;text-transform:uppercase;letter-spacing:.03em}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.swatches button{width:30px;height:30px;border-radius:50%}
.swatches button.on{outline:3px solid var(--text);outline-offset:2px}
details.hidden-accs summary{list-style:none;cursor:pointer}
details.hidden-accs summary::-webkit-details-marker{display:none}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:50;transition:transform .3s;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:60;color:#fff;font-weight:650}
.loading.on{display:grid}
.note{font-size:13px;color:var(--muted);margin:8px 6px 0;line-height:1.45}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs">
  <button data-action="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Özet</button>
  <button data-action="tab" data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Hesaplar</button>
  <button class="fab" data-action="add-tx" aria-label="İşlem ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-action="tab" data-tab="txs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>İşlemler</button>
  <button data-action="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</button>
</nav>

<div id="scrim" data-action="close-sheet"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div class="loading" id="loading">İçe aktarılıyor…</div>
<input type="file" id="file-mm" accept=".mmbak,.sqlite,.db,application/octet-stream" hidden>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-icon" accept="image/*" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTRY = new Intl.NumberFormat('tr-TR', {style:'currency', currency:'TRY', minimumFractionDigits:2, maximumFractionDigits:2});
const fmtTRY0 = new Intl.NumberFormat('tr-TR', {style:'currency', currency:'TRY', maximumFractionDigits:0});
const money = (v, dec = true) => (dec ? fmtTRY : fmtTRY0).format(Math.abs(v) < 0.005 ? 0 : v);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const curMonth = () => todayStr().slice(0, 7);
const shiftMonth = (m, n) => { let [y, mo] = m.split('-').map(Number); mo += n; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return `${y}-${pad(mo)}`; };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthLabel = m => parseD(m + '-01').toLocaleDateString('tr-TR', {month:'long', year:'numeric'});
const monthShort = m => parseD(m + '-01').toLocaleDateString('tr-TR', {month:'short'});
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dim = (y, m) => new Date(y, m, 0).getDate(); // m is 1-based
// builds a date, rolling months over and clamping the day (31 -> 30/28) so "every 31st" works in short months
const mkDate = (y, m, d) => { while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}-${pad(Math.min(d, dim(y, m)))}`; };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const shortDate = s => parseD(s).toLocaleDateString('tr-TR', {day:'numeric', month:'short'});
const daysUntil = s => Math.round((parseD(s) - parseD(todayStr())) / 864e5);
const relDay = s => { const n = daysUntil(s); if (n === 0) return 'Bugün'; if (n === 1) return 'Yarın'; if (n < 0) return `${-n} gün gecikti`; if (n < 7) return `${n} gün sonra`; return shortDate(s); };
const dayLabel = s => {
  const t = todayStr(), y = new Date(); y.setDate(y.getDate() - 1);
  const ys = `${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`;
  if (s === t) return 'Bugün'; if (s === ys) return 'Dün';
  return parseD(s).toLocaleDateString('tr-TR', {day:'numeric', month:'long', weekday:'long'});
};
const parseAmount = s => {
  s = String(s).trim().replace(/[₺\s]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/\.\d{3}(\.|$)/.test(s)) s = s.replace(/\./g, '');
  return Math.round(parseFloat(s) * 100) / 100;
};

/* ---------- derived data ---------- */
let D = null; // cache, rebuilt on change
function derive() {
  const today = todayStr();
  const acc = new Map(S.accounts.map(a => [a.id, a]));
  const cat = new Map(S.categories.map(c => [c.id, c]));
  const bal = new Map(S.accounts.map(a => [a.id, +a.opening || 0]));
  const future = new Map();
  const add = (m, id, v) => m.set(id, (m.get(id) || 0) + v);
  for (const t of S.txs) {
    const m = t.date > today ? future : bal;
    if (t.type === 'expense') add(m, t.accountId, -t.amount);
    else if (t.type === 'income') add(m, t.accountId, t.amount);
    else if (t.type === 'adjust') add(m, t.accountId, t.amount);
    else if (t.type === 'transfer') { add(m, t.accountId, -t.amount); add(m, t.toAccountId, t.amount); }
  }
  const byMonth = new Map();
  for (const t of S.txs) { const k = t.date.slice(0, 7); if (!byMonth.has(k)) byMonth.set(k, []); byMonth.get(k).push(t); }
  for (const l of byMonth.values()) l.sort(txSort);
  let assets = 0, debts = 0;
  for (const a of S.accounts) { if (a.hidden || a.deleted) continue; const v = bal.get(a.id) || 0; if (v >= 0) assets += v; else debts += v; }
  D = {acc, cat, bal, future, byMonth, assets, debts, today};
}
const txSort = (a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0);
const topCat = id => { let c = D.cat.get(id); while (c && c.parentId && D.cat.get(c.parentId)) c = D.cat.get(c.parentId); return c; };
const catPath = id => { const c = D.cat.get(id); if (!c) return 'Kategorisiz'; const p = c.parentId && D.cat.get(c.parentId); return p ? `${p.name} › ${c.name}` : c.name; };
const accName = id => { const a = D.acc.get(id); return !a ? 'Silinmiş hesap' : a.deleted ? `${a.name} (silinmiş)` : a.name; };
/* ---------- credit card cycle ---------- */
function balAt(id, date) {
  let v = +(D.acc.get(id)?.opening) || 0;
  for (const t of S.txs) {
    if (t.date > date) continue;
    if (t.accountId === id) v += (t.type === 'income' || t.type === 'adjust') ? t.amount : -t.amount;
    if (t.type === 'transfer' && t.toAccountId === id) v += t.amount;
  }
  return v;
}
// statementDay = last day included in a statement (the cut happens at 23:59 that day; 31 = month end).
// Statement = card debt at the end of that day. Payments made since are deducted, the rest is due
// on the due day. Spending after the cut goes to the next statement.
function cardCycle(a) {
  const sd = +a.statementDay, pd = +a.dueDay;
  if (a.type !== 'card' || !sd || !pd) return null;
  const t = D.today, [y, m] = t.split('-').map(Number);
  let close = mkDate(y, m, sd); if (close >= t) close = mkDate(y, m - 1, sd); // today's cut hasn't happened yet
  const [cy, cm] = close.split('-').map(Number);
  const due = pd > sd ? mkDate(cy, cm, pd) : mkDate(cy, cm + 1, pd);
  const nextClose = mkDate(cy, cm + 1, sd);
  const nextDue = pd > sd ? mkDate(cy, cm + 1, pd) : mkDate(cy, cm + 2, pd);
  const statement = Math.max(0, -balAt(a.id, close));
  let paid = 0;
  for (const x of S.txs) {
    if (x.date <= close || x.date > t) continue;
    if (x.type === 'transfer' && x.toAccountId === a.id) paid += x.amount;
    else if (x.type === 'income' && x.accountId === a.id) paid += x.amount;
  }
  const dueNow = Math.max(0, Math.round((statement - paid) * 100) / 100);
  const next = Math.max(0, Math.round((-balAt(a.id, nextClose) - dueNow) * 100) / 100);
  return {close, due, nextClose, nextDue, statement, paid, dueNow, next};
}

/* ---------- recurring ---------- */
const FREQ = {monthly:'Her ay', weekly:'Her hafta', yearly:'Her yıl'};
function nextOcc(r, from) {
  if (r.freq === 'weekly') return addDays(from, 7);
  const [y, m] = from.split('-').map(Number);
  return r.freq === 'yearly' ? mkDate(y + 1, m, r.anchorDay) : mkDate(y, m + 1, r.anchorDay);
}
const firstOcc = (r, floor) => { let d = r.startDate, g = 0; while (d < floor && g++ < 5000) d = nextOcc(r, d); return d; };
const ruleActive = r => !r.paused && (!r.endDate || r.nextDate <= r.endDate);
function ruleDesc(r) {
  const d = parseD(r.startDate);
  if (r.freq === 'weekly') return 'Her ' + d.toLocaleDateString('tr-TR', {weekday:'long'});
  if (r.freq === 'yearly') return 'Her yıl ' + d.toLocaleDateString('tr-TR', {day:'numeric', month:'long'});
  return `Her ayın ${r.anchorDay}. günü`;
}
const ruleTx = (r, date) => ({id:uid(), type:r.type, amount:r.amount, accountId:r.accountId, toAccountId:r.type === 'transfer' ? r.toAccountId : null,
  categoryId:r.type === 'transfer' ? null : r.categoryId, date, note:r.note || '', memo:'', ts:Date.now(), recurringId:r.id, icon:r.icon || null});
// adds every automatic occurrence that has come due; runs on open and when the app returns to the foreground
function runRecurring() {
  const t = todayStr(); let n = 0;
  for (const r of S.rules || []) {
    if (!r.auto) continue;
    let g = 0;
    while (ruleActive(r) && r.nextDate <= t && g++ < 400) { S.txs.push(ruleTx(r, r.nextDate)); r.nextDate = nextOcc(r, r.nextDate); n++; }
  }
  if (n) save();
  return n;
}
const pendingRules = () => (S.rules || []).filter(r => !r.auto && ruleActive(r) && r.nextDate <= todayStr());
function ruleLook(r) {
  const isT = r.type === 'transfer', c = D.cat.get(r.categoryId), tc = topCat(r.categoryId);
  return {icon:r.icon || (isT ? '⇄' : (c?.emoji || tc?.emoji || '•')), color:isT ? '#64748B' : (tc?.color || '#64748B'),
    title:r.note || (isT ? 'Transfer' : c?.name || 'Kategorisiz'),
    acc:isT ? `${accName(r.accountId)} → ${accName(r.toAccountId)}` : accName(r.accountId)};
}
function upcoming(days) {
  const t = todayStr(), lim = addDays(t, days), out = [];
  for (const a of S.accounts) {
    if (a.type !== 'card' || a.deleted) continue;
    const c = cardCycle(a);
    if (c && c.dueNow > 0.004) out.push({date:c.due, action:`data-action="open-acc" data-id="${a.id}"`, icon:'💳', color:a.color || hashColor(a.id), title:`${a.name} ekstresi`, sub:'Kredi kartı', amount:-c.dueNow});
  }
  for (const r of S.rules || []) {
    if (!ruleActive(r)) continue;
    const L = ruleLook(r); let d = r.nextDate, g = 0;
    while (d <= lim && (!r.endDate || d <= r.endDate) && g++ < 60) {

}

}

function monthStats(m) {

function renderTxList() {

VIEWS.recurring = () => {
  const rules = (S.rules || []).slice().sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  const pend = pendingRules(), pendIds = new Set(pend.map(r => r.id));
  const live = rules.filter(r => ruleActive(r) && !pendIds.has(r.id)), done = rules.filter(r => !ruleActive(r));
  const perMonth = r => r.freq === 'weekly' ? r.amount * 52 / 12 : r.freq === 'yearly' ? r.amount / 12 : r.amount;
  const act = rules.filter(ruleActive);
  const fixedExp = act.filter(r => r.type === 'expense').reduce((s, r) => s + perMonth(r), 0);
  const fixedInc = act.filter(r => r.type === 'income').reduce((s, r) => s + perMonth(r), 0);
  const row = (r, pending) => {
    const L = ruleLook(r), sign = r.type === 'income' ? '+' : r.type === 'transfer' ? '' : '−';
    const when = !ruleActive(r) ? (r.paused ? 'Duraklatıldı' : 'Bitti') : pending ? `${shortDate(r.nextDate)} · onay bekliyor` : `Sonraki: ${relDay(r.nextDate)}`;
    return `<button class="row" data-action="edit-rule" data-id="${r.id}" style="${ruleActive(r) ? '' : 'opacity:.5'}">
      <div class="ic" style="background:${L.color}22;color:${L.color}">${ico(L.icon)}</div>
      <div class="t"><b>${esc(L.title)}${r.auto ? '' : '<span class="badge">Elle onay</span>'}</b><small>${esc(ruleDesc(r))} · ${esc(L.acc)}</small></div>

      ${pending ? `<div class="row-actions"><button data-action="rule-skip" data-id="${r.id}">Bu sefer atla</button><button class="on" data-action="rule-post" data-id="${r.id}">Ekle</button></div>` : ''}`;
  };
  let html = `<header class="big"><div><button class="back" data-action="back">${ICON.chevL}Geri</button><h1>Tekrarlayanlar</h1></div><button class="icon-btn" data-action="add-rule" aria-label="Tekrarlayan işlem ekle">${ICON.plus}</button></header>`;
  if (!rules.length) return html + `<div class="empty"><div class="big">🔁</div><p>Kira, maaş, abonelik, fatura, kredi taksiti gibi düzenli işlemlerini bir kez tanımla. Zamanı gelince kendiliğinden eklensin ya da senin onayını beklesin.</p><button class="primary" data-action="add-rule">İlk tekrarlayan işlemi ekle</button></div>`;
  html += `<div class="tiles">
    <div class="tile"><span>Sabit gider /ay</span><b class="num neg">${money(fixedExp, false)}</b></div>
    <div class="tile"><span>Sabit gelir /ay</span><b class="num pos">${money(fixedInc, false)}</b></div>
    <div class="tile"><span>Aktif</span><b class="num">${act.length}</b></div></div>`;
  if (pend.length) html += `<div class="sec-title">Onay bekleyenler<small>${pend.length}</small></div><div class="list">${pend.map(r => row(r, true)).join('')}</div>`;
  if (live.length) html += `<div class="sec-title">Aktif</div><div class="list">${live.map(r => row(r)).join('')}</div>`;
  if (done.length) html += `<div class="sec-title">Biten ve duraklatılan</div><div class="list">${done.map(r => row(r)).join('')}</div>`;
  return html + `<p class="note">"Otomatik" olanlar zamanı gelince kendiliğinden eklenir. "Elle onay" olanlar tutarı değişebilen işlemler içindir (fatura gibi); zamanı gelince burada onayını bekler.</p>`;
};

/* ---------- sheets ---------- */
let sheetState = null;
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; document.body.classList.add('sheet-open'); $('#sheet').scrollTop = 0; }
function closeSheet() { document.body.classList.remove('sheet-open'); sheetState = null; }

const accOptions = (sel, filter = () => true) => S.accounts.filter(a => ((!a.hidden && !a.deleted) || a.id === sel) && filter(a))
  .sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join('');

const defaultAcc = () => { const l = D.acc.get(S.meta.lastAccount); return l && !l.deleted && !l.hidden ? l.id : S.accounts.find(a => !a.hidden && !a.deleted)?.id; };
function setCatParent() { const c = D.cat.get(sheetState.categoryId); sheetState.catParent = c ? (c.parentId && D.cat.get(c.parentId) ? c.parentId : c.id) : null; }
function ruleSheet(r) {
  sheetState = r ? {...r, amount:String(r.amount).replace('.', ','), endDate:r.endDate || '', isNew:false, isRule:true}
    : {id:uid(), type:'expense', amount:'', accountId:defaultAcc(), toAccountId:null, categoryId:null, note:'', freq:'monthly', startDate:todayStr(), endDate:'', auto:true, paused:false, isNew:true, isRule:true};
  setCatParent(); drawTxSheet();
}
function saveRule() {
  const d = sheetState, amount = parseAmount(d.amount);
  if (!(amount > 0)) return toast('Tutar gir');
  if (!d.accountId) return toast('Hesap seç');
  if (d.type === 'transfer' && (!d.toAccountId || d.toAccountId === d.accountId)) return toast('Hedef hesabı seç');
  if (d.type !== 'transfer' && !d.categoryId) return toast('Kategori seç');
  if (!d.startDate) return toast('Başlangıç tarihi seç');
  if (d.endDate && d.endDate < d.startDate) return toast('Bitiş tarihi başlangıçtan önce olamaz');
  S.rules = S.rules || [];
  const old = S.rules.find(x => x.id === d.id);
  const r = {id:d.id, type:d.type, amount, accountId:d.accountId, toAccountId:d.type === 'transfer' ? d.toAccountId : null,
    categoryId:d.type === 'transfer' ? null : d.categoryId, note:(d.note || '').trim(), icon:d.icon || null, freq:d.freq, startDate:d.startDate,
    anchorDay:+d.startDate.slice(8), endDate:d.endDate || null, auto:!!d.auto, paused:!!d.paused};
  if (old && old.startDate === r.startDate && old.freq === r.freq) r.nextDate = old.nextDate;
  else {
    // past occurrences are never back-filled: the first one is today or later (and after anything already generated)
    const made = S.txs.filter(t => t.recurringId === r.id).reduce((m, t) => t.date > m ? t.date : m, '');
    const today = todayStr();
    r.nextDate = firstOcc(r, made >= today ? addDays(made, 1) : today);
  }
  if (old) Object.assign(old, r); else S.rules.push(r);
  const n = runRecurring(); save(); closeSheet(); render();
  toast(n ? `Kaydedildi, bugünkü işlem eklendi` : `Kaydedildi · ilk işlem ${shortDate(r.nextDate)}`);
}

  sheetState = t ? {...t, isNew:false} : {id:uid(), type:'expense', amount:'', accountId:lastAcc, toAccountId:null, categoryId:null, date:todayStr(), note:'', isNew:true};
  if (typeof sheetState.amount === 'number') sheetState.amount = String(sheetState.amount).replace('.', ',');

  const isAdj = d.type === 'adjust';

      ${d.isNew ? '' : `<div class="field"><label>Duraklat</label><span style="flex:1"></span><input type="checkbox" data-f="paused" ${d.paused ? 'checked' : ''}></div>`}`

      <div class="field"><label>Not</label><input data-f="note" value="${esc(d.note)}" placeholder="İsteğe bağlı"></div>

      <div class="sub-label">Kategori</div>
      <div class="cats">${parents.map(p => `<button class="chip ${d.catParent === p.id ? 'on' : ''}" data-action="pick-parent" data-id="${p.id}">${p.emoji ? ico(p.emoji, 'inline') : ''} ${esc(p.name)}</button>`).join('')}</div>
      ${children.length ? `<div class="sub-label">Alt kategori</div><div class="cats">${children.map(ch => `<button class="chip ${d.categoryId === ch.id ? 'on' : ''}" data-action="pick-cat" data-id="${ch.id}">${esc(ch.name)}</button>`).join('')}</div>` : ''}`}
    ${d.isRule ? `<p class="note">Ayın 29–31'i gibi günler kısa aylarda ayın son gününe kayar. Geçmiş tarihli tekrarlar geriye dönük eklenmez.</p>` : ''}
    ${d.isNew ? '' : `<button class="secondary danger" data-action="del-tx">${d.isRule ? 'Tekrarı sil (eklenmiş işlemler kalır)' : 'İşlemi sil'}</button>`}
    ${!d.isRule && !d.isNew && d.recurringId ? '<p class="note" style="text-align:center">Bu işlem bir tekrarlayan işlemden oluşturuldu. Burada değiştirmek yalnızca bu kaydı etkiler.</p>' : ''}
  `);
  sizeAmt();
}
function sizeAmt() { const i = $('#f-amt'); if (i) i.style.width = Math.max(1, (i.value || i.placeholder).length) * 0.62 + 0.3 + 'em'; }

function accSheet(a) {
  sheetState = a ? {...a, isNew:false} : {id:uid(), name:'', type:'bank', parentId:null, opening:0, limit:null, color:PALETTE[S.accounts.length % PALETTE.length], hidden:false, order:S.accounts.length, isNew:true};
  const debtType = ['card', 'loan'].includes(sheetState.type);
  sheetState.openingStr = sheetState.opening ? String(Math.abs(debtType ? -sheetState.opening : sheetState.opening)).replace('.', ',') : '';
  drawAccSheet();
}
function drawAccSheet() {
  const d = sheetState, debt = ['card', 'loan'].includes(d.type);
  const used = !d.isNew && S.txs.some(t => t.accountId === d.id || t.toAccountId === d.id);
  openSheet(`
    <div class="sheet-head"><button data-action="close-sheet">Vazgeç</button><h2>${d.isNew ? 'Yeni hesap' : 'Hesap'}</h2><button data-action="save-acc" style="font-weight:700">Kaydet</button></div>
    <div class="form">
      <div class="field"><label>Ad</label><input data-f="name" value="${esc(d.name)}" placeholder="Örn. Garanti Vadesiz"></div>
      <div class="field"><label>Tür</label><select data-f="type" data-redraw="1">${Object.entries(ACC_TYPES).map(([k, l]) => `<option value="${k}" ${d.type === k ? 'selected' : ''}>${l.replace(/ları$|leri$|lar$|ler$/, '')}</option>`).join('')}</select></div>
      ${d.type === 'card' ? `<div class="field"><label>Bağlı banka</label><select data-f="parentId"><option value="">Yok</option>${accOptions(d.parentId, x => x.type === 'bank')}</select></div>
      <div class="field"><label>Limit</label><input data-f="limitStr" inputmode="decimal" value="${d.limit ? String(d.limit).replace('.', ',') : ''}" placeholder="İsteğe bağlı"></div>
      <div class="field"><label>Kesim günü</label><input data-f="statementDay" inputmode="numeric" value="${d.statementDay || ''}" placeholder="Ekstreye giren son gün"></div>
      <div class="field"><label>Son ödeme</label><input data-f="dueDay" inputmode="numeric" value="${d.dueDay || ''}" placeholder="Ayın kaçı, örn. 7"></div>` : ''}
      <div class="field"><label>${debt ? 'Açılış borcu' : 'Açılış bakiyesi'}</label><input data-f="openingStr" inputmode="decimal" value="${esc(d.openingStr)}" placeholder="0"></div>
      <div class="field"><label>Gizle</label><span style="flex:1;text-align:right;color:var(--muted);font-size:14px">Toplamlara dahil etme</span><input type="checkbox" data-f="hidden" ${d.hidden ? 'checked' : ''}></div>
    </div>
    ${d.type === 'card' ? '<p class="note" style="margin:-6px 6px 14px">Kesim günü ekstreye giren son gündür; kesim o gün 23:59\'da yapılır. Ay sonu için 31 yaz.</p>' : ''}
    <div class="form"><div class="swatches">${PALETTE.map(c => `<button style="background:${c}" class="${d.color === c ? 'on' : ''}" data-action="pick-color" data-c="${c}" aria-label="Renk"></button>`).join('')}</div></div>
    ${d.isNew ? '' : `<button class="secondary danger" data-action="del-acc">${used ? 'Hesabı sil (işlemleri de silinir)' : 'Hesabı sil'}</button>`}
  `);
}

function catsSheet() {
  sheetState = {mode:'list', kind:'expense'};
  drawCatsSheet();
}
// icon a category gets when none was picked: guessed from its name, else its parent's, else a tag
const autoCatIcon = c => { const g = guessEmoji(c.name || ''); return g !== '•' ? g : (S.categories.find(p => p.id === c.parentId)?.emoji || '🏷️'); };
function drawCatsSheet() {
  if (sheetState.picking) return drawIconPicker();
  const d = sheetState;
  if (d.mode === 'list') {
    const parents = S.categories.filter(c => c.kind === d.kind && !c.parentId).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const row = (c, nested) => `<button class="row ${nested ? 'nested' : ''}" data-action="edit-cat" data-id="${c.id}" style="${c.hidden ? 'opacity:.45' : ''}"><div class="ic" style="background:${(c.color || '#64748B')}22">${ico(c.emoji)}</div><div class="t"><b>${esc(c.name)}</b>${c.hidden ? '<small>Gizli</small>' : ''}</div>${ICON.rowChev}</button>`;
    openSheet(`
      <div class="sheet-head"><button data-action="close-sheet">Kapat</button><h2>Kategoriler</h2><button data-action="new-cat">Ekle</button></div>
      <div class="seg">${[['expense', 'Gider'], ['income', 'Gelir']].map(([k, l]) => `<button class="${d.kind === k ? 'on' : ''}" data-action="cat-kind" data-v="${k}">${l}</button>`).join('')}</div>
      ${parents.map(p => `<div class="list" style="margin-bottom:10px">${row(p)}${S.categories.filter(c => c.parentId === p.id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).map(c => row(c, true)).join('')}<button class="row nested" data-action="new-cat" data-parent="${p.id}"><div class="ic" style="background:var(--chip);color:var(--accent);font-size:20px">＋</div><div class="t"><b style="color:var(--accent);font-weight:600">Alt kategori ekle</b></div></button></div>`).join('')}`);
  } else {
    const c = d.cat, parents = S.categories.filter(x => x.kind === c.kind && !x.parentId && x.id !== c.id);
    const hasChildren = S.categories.some(x => x.parentId === c.id);
    openSheet(`
      <div class="sheet-head"><button data-action="cat-back">Geri</button><h2>${c.isNew ? 'Yeni kategori' : 'Kategori'}</h2><button data-action="save-cat" style="font-weight:700">Kaydet</button></div>
      <div class="form">
        <div class="field"><label>Ad</label><input data-cf="name" value="${esc(c.name)}"></div>
        <button class="field" data-action="icon-open" style="width:100%;text-align:left"><label>Varsayılan simge</label><span style="flex:1;text-align:right;color:var(--muted);font-size:13px">${c.emoji ? '' : 'Seçmezsen addan tahmin edilir'}</span><span class="ic" style="background:${(c.color || '#64748B')}22">${ico(c.emoji || autoCatIcon(c))}</span>${ICON.rowChev}</button>
        ${hasChildren ? '' : `<div class="field"><label>Üst kategori</label><select data-cf="parentId"><option value="">Yok (ana kategori)</option>${parents.map(p => `<option value="${p.id}" ${c.parentId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>`}
        <div class="field"><label>Gizle</label><span style="flex:1"></span><input type="checkbox" data-cf="hidden" ${c.hidden ? 'checked' : ''}></div>
      </div>
      <p class="note">Gizlenen kategoriler eski işlemlerde görünmeye devam eder, yeni işlem eklerken listede çıkmaz.</p>`);
  }
}

/* ---------- actions ---------- */
const A = {
  'icon-open'() { sheetState.picking = true; sheetState.iconManage = false; drawIconPicker(); },
  'icon-cancel'() { sheetState.picking = false; iconCtx().redraw(); },
  'icon-pick'(el) { const c = iconCtx(); c.set(el.dataset.v); sheetState.picking = false; c.redraw(); },
  'icon-custom'() {
    const v = firstGrapheme(($('#emoji-in')?.value || '').trim());
    if (!v || /^[\p{L}\p{N}]$/u.test(v)) return toast('Bir emoji yaz');
    const c = iconCtx(); c.set(v); sheetState.picking = false; c.redraw();
  },
  'icon-upload'() { $('#file-icon').click(); },
  'icon-manage'() { sheetState.iconManage = !sheetState.iconManage; drawIconPicker(); },
  'icon-del'(el) {
    if (!confirm('Bu simge silinsin mi? Kullanıldığı yerlerde kategorinin simgesi görünür.')) return;
    const ref = 'img:' + el.dataset.id;
    delete S.icons[el.dataset.id];
    for (const t of S.txs) if (t.icon === ref) delete t.icon;
    for (const r of S.rules || []) if (r.icon === ref) r.icon = null;
    for (const c of S.categories) if (c.emoji === ref) c.emoji = guessEmoji(c.name);
    if (sheetState.icon === ref) sheetState.icon = null;
    if (sheetState.cat?.emoji === ref) sheetState.cat.emoji = guessEmoji(sheetState.cat.name);
    save(); derive(); drawIconPicker();
  },
  back() { ui.tab = ui.prevTab && ui.prevTab !== 'recurring' ? ui.prevTab : 'settings'; render(); window.scrollTo(0, 0); },
  'add-rule'() { if (!S.accounts.length) return toast('Önce bir hesap ekle'); ruleSheet(); },
  'edit-rule'(el) { ruleSheet(S.rules.find(r => r.id === el.dataset.id)); },
  'rule-post'(el) { const r = S.rules.find(x => x.id === el.dataset.id); S.txs.push(ruleTx(r, r.nextDate)); r.nextDate = nextOcc(r, r.nextDate); save(); render(); toast('İşlem eklendi'); },
  'rule-skip'(el) { const r = S.rules.find(x => x.id === el.dataset.id); r.nextDate = nextOcc(r, r.nextDate); save(); render(); toast('Bu seferlik atlandı'); },
  'pay-card'(el) {
    const a = D.acc.get(el.dataset.id), amt = Math.round(+el.dataset.amt * 100) / 100;
    const live = x => x && !x.deleted && !x.hidden;
    const from = live(D.acc.get(a.parentId)) ? a.parentId : S.accounts.find(x => x.type === 'bank' && live(x))?.id;
    txSheet();
    Object.assign(sheetState, {type:'transfer', accountId:from || sheetState.accountId, toAccountId:a.id, amount:String(amt).replace('.', ','), note:`${a.name} ekstre ödemesi`, categoryId:null, catParent:null});
    drawTxSheet();
  },
  tab(el, e) { e?.preventDefault(); if (el.dataset.tab !== ui.tab) ui.prevTab = ui.tab; ui.tab = el.dataset.tab; if (ui.tab !== 'txs') { ui.accFilter = null; ui.catFilter = null; } ui.q = ''; render(); window.scrollTo(0, 0); },
  month(el) { ui.month = shiftMonth(ui.month, +el.dataset.d); render(); },
  'goto-month'(el) { ui.month = el.dataset.m; render(); },
  'cat-drill'(el) { ui.catFilter = el.dataset.id; ui.accFilter = null; ui.tab = 'txs'; render(); window.scrollTo(0, 0); },
  'open-acc'(el) { ui.accFilter = el.dataset.id; ui.catFilter = null; ui.tab = 'txs'; ui.q = ''; render(); window.scrollTo(0, 0); },
  'clear-acc'() { ui.accFilter = null; render(); },
  'clear-cat'() { ui.catFilter = null; render(); },
  'close-sheet': closeSheet,
  'add-tx'() { if (!S.accounts.length) { toast('Önce bir hesap ekle'); accSheet(); return; } txSheet(); },
  'edit-tx'(el) { txSheet(S.txs.find(t => t.id === el.dataset.id)); },
  'tx-type'(el) { sheetState.type = el.dataset.v; const c = D.cat.get(sheetState.categoryId); if (c && c.kind !== sheetState.type) { sheetState.categoryId = null; sheetState.catParent = null; } drawTxSheet(); },
  'pick-parent'(el) { sheetState.catParent = el.dataset.id; sheetState.categoryId = el.dataset.id; drawTxSheet(); },
  'pick-cat'(el) { sheetState.categoryId = el.dataset.id; drawTxSheet(); },
  'save-tx'() {
    if (sheetState.isRule) return saveRule();
    const d = sheetState, amount = parseAmount(d.amount);
    if (d.type === 'transfer') { if (!(amount > 0)) return toast('Tutar gir'); }
    else if (isNaN(amount) || amount === 0) return toast('Tutar gir'); // negative expense = refund
    if (!d.accountId) return toast('Hesap seç');
    if (d.type === 'transfer' && (!d.toAccountId || d.toAccountId === d.accountId)) return toast('Hedef hesabı seç');
    if ((d.type === 'expense' || d.type === 'income') && !d.categoryId) return toast('Kategori seç');
    const t = {id:d.id, type:d.type, amount, accountId:d.accountId, toAccountId:d.type === 'transfer' ? d.toAccountId : null,
      categoryId:d.type === 'transfer' || d.type === 'adjust' ? null : d.categoryId, date:d.date || todayStr(), note:(d.note || '').trim(), memo:d.memo || '', ts:d.ts || Date.now()};
    if (d.recurringId) t.recurringId = d.recurringId;
    if (d.icon && d.type !== 'adjust') t.icon = d.icon;
    const i = S.txs.findIndex(x => x.id === t.id);
    if (i >= 0) S.txs[i] = t; else S.txs.push(t);
    S.meta.lastAccount = t.accountId;
    save(); closeSheet(); render(); toast(d.isNew ? 'İşlem eklendi' : 'Güncellendi');
  },
  'del-tx'() {
    if (sheetState.isRule) {
      if (!confirm('Bu tekrarlayan işlem silinsin mi? Daha önce eklenmiş işlemler yerinde kalır.')) return;
      S.rules = S.rules.filter(r => r.id !== sheetState.id); save(); closeSheet(); render(); toast('Tekrar silindi'); return;
    }
    if (!confirm('Bu işlem silinsin mi?')) return; S.txs = S.txs.filter(t => t.id !== sheetState.id); save(); closeSheet(); render(); toast('Silindi'); },
  'add-acc'() { accSheet(); },
  'edit-acc'(el) { accSheet(S.accounts.find(a => a.id === el.dataset.id)); },
  'pick-color'(el) { sheetState.color = el.dataset.c; drawAccSheet(); },
  'save-acc'() {
    const d = sheetState; if (!d.name.trim()) return toast('Hesap adı gir');
    const debt = ['card', 'loan'].includes(d.type);
    const o = parseAmount(d.openingStr || '0') || 0;
    const lim = d.type === 'card' ? parseAmount(d.limitStr ?? (d.limit ? String(d.limit) : '')) : NaN;
    const day = v => { const n = parseInt(v, 10); return n >= 1 && n <= 31 ? n : null; };
    const isCard = d.type === 'card';
    if (isCard && (String(d.statementDay ?? '').trim() || String(d.dueDay ?? '').trim()) && (!day(d.statementDay) || !day(d.dueDay))) return toast('Kesim ve son ödeme günü 1–31 arası olmalı');
    const a = {...(S.accounts.find(x => x.id === d.id) || {}), id:d.id, name:d.name.trim(), type:d.type, parentId:isCard ? (d.parentId || null) : null,
      opening:debt ? -Math.abs(o) : o, limit:isNaN(lim) ? null : lim, color:d.color, hidden:!!d.hidden, order:d.order ?? S.accounts.length,
      statementDay:isCard ? day(d.statementDay) : null, dueDay:isCard ? day(d.dueDay) : null};
    const i = S.accounts.findIndex(x => x.id === a.id);
    if (i >= 0) S.accounts[i] = a; else S.accounts.push(a);
    save(); closeSheet(); render(); toast('Kaydedildi');
  },
  'del-acc'() {
    const d = sheetState, n = S.txs.filter(t => t.accountId === d.id || t.toAccountId === d.id).length;
    if (!confirm(n ? `"${d.name}" ve ona ait ${n} işlem kalıcı olarak silinecek. Emin misin?` : `"${d.name}" silinsin mi?`)) return;
    S.txs = S.txs.filter(t => t.accountId !== d.id && t.toAccountId !== d.id);
    S.rules = (S.rules || []).filter(r => r.accountId !== d.id && r.toAccountId !== d.id);
    S.accounts = S.accounts.filter(a => a.id !== d.id).map(a => a.parentId === d.id ? {...a, parentId:null} : a);
    if (ui.accFilter === d.id) { ui.accFilter = null; }
    save(); closeSheet(); render(); toast('Hesap silindi');
  },
  'manage-cats'() { catsSheet(); },
  'cat-kind'(el) { sheetState.kind = el.dataset.v; drawCatsSheet(); },
  'edit-cat'(el) { const c = S.categories.find(x => x.id === el.dataset.id); sheetState = {mode:'edit', kind:c.kind, cat:{...c}}; drawCatsSheet(); },
  'new-cat'(el) {
    const parent = S.categories.find(p => p.id === el.dataset.parent);
    sheetState = {mode:'edit', kind:sheetState.kind, cat:{id:uid(), name:'', emoji:'', kind:sheetState.kind, parentId:parent?.id || null,
      color:parent?.color || CAT_COLORS[S.categories.filter(c => !c.parentId).length % CAT_COLORS.length], hidden:false, order:999, isNew:true}};
    drawCatsSheet();
  },
  'cat-back'() { sheetState = {mode:'list', kind:sheetState.kind}; drawCatsSheet(); },
  'save-cat'() {
    const c = sheetState.cat; if (!c.name.trim()) return toast('Ad gir');
    const {isNew, ...clean} = c; clean.name = c.name.trim(); clean.parentId = c.parentId || null;
    if (!clean.emoji) clean.emoji = autoCatIcon(clean);
    if (!clean.color) clean.color = hashColor(clean.id);
    const i = S.categories.findIndex(x => x.id === c.id); if (i >= 0) S.categories[i] = clean; else S.categories.push(clean);
    save(); derive(); sheetState = {mode:'list', kind:c.kind}; drawCatsSheet(); render(); toast('Kaydedildi');
  },
  'import-mm'() { $('#file-mm').click(); },
  'import-json'() { $('#file-json').click(); },
  'export-json'() { exportJSON(); },
  'wipe'() { if (!confirm('Tüm hesaplar, kategoriler ve işlemler bu cihazdan kalıcı olarak silinecek. Önce yedek almanı öneririm. Devam edilsin mi?')) return; S = emptyState(); save(); ui.tab = 'home'; render(); toast('Tüm veriler silindi'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const f = A[el.dataset.action]; if (f) { if (el.tagName === 'A') e.preventDefault(); f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { ui.q = el.value; $('#month-wrap').innerHTML = ui.q ? '' : monthSwitch(); renderTxList(); return; }
  if (!sheetState) return;
  if (el.dataset.f) { sheetState[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; }
  if (el.id === 'f-amt') sizeAmt();
  if (el.dataset.cf) { sheetState.cat[el.dataset.cf] = el.type === 'checkbox' ? el.checked : el.value; }
});
document.addEventListener('change', e => {
  const el = e.target; if (!sheetState) return;
  if (el.dataset.f) {
    sheetState[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.redraw) drawAccSheet();
    if (el.dataset.f === 'accountId' && sheetState.type === 'transfer') drawTxSheet();
  }
  if (el.dataset.cf) sheetState.cat[el.dataset.cf] = el.type === 'checkbox' ? el.checked : el.value;
});

/* ---------- backup ---------- */
async function exportJSON() {
  S.meta.lastBackup = Date.now();
  const name = `cuzdan-yedek-${todayStr()}.json`;
  const blob = new Blob([JSON.stringify(S)], {type:'application/json'});
  const file = new File([blob], name, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Cüzdan yedeği'}); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
    save(); render(); toast('Yedek hazır');
  } catch (err) { if (err.name !== 'AbortError') toast('Yedek alınamadı: ' + err.message); }
}
$('#file-icon').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !sheetState) return;
  try {
    const url = await resizeImage(f, 128), id = uid();
    S.icons = S.icons || {}; S.icons[id] = url; save();
    const c = iconCtx(); c.set('img:' + id); sheetState.picking = false; c.redraw(); toast('Simge eklendi');
  } catch (err) { toast(err.message); }
});
$('#file-json').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.accounts) || !Array.isArray(data.txs)) throw new Error('Bu bir Cüzdan yedeği değil');
    if (S.txs.length && !confirm(`Mevcut veriler (${S.txs.length} işlem) bu yedekle değiştirilecek. Devam edilsin mi?`)) return;
    S = {...emptyState(), ...data}; save(); ui.tab = 'home'; render(); toast(`${S.txs.length} işlem geri yüklendi`);
  } catch (err) { toast('Yüklenemedi: ' + err.message); }
});

/* ---------- Money Manager (.mmbak) import ---------- */
let sqlPromise;
function loadSql() {
  if (!sqlPromise) sqlPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js';
    s.onload = () => initSqlJs({locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`}).then(res, rej);
    s.onerror = () => { sqlPromise = null; rej(new Error('İçe aktarıcı yüklenemedi, internet bağlantını kontrol et')); };
    document.head.appendChild(s);
  });
  return sqlPromise;
}
const CORE_DATA_EPOCH = 978307200; // 2001-01-01, Apple Core Data timestamps
const MM_GROUPS = {'1':'bank', '2':'card', '3':'bank', '4':'savings', '5':'loan', '6':'ewallet', '7':'other', '8':'invest', '9':'loan', '10':'insurance', '11':'cash'};
function groupType(uid, name) {
  if (MM_GROUPS[uid]) return MM_GROUPS[uid];
  const n = String(name || '').toLocaleLowerCase('tr');
  if (n.includes('kredi kart')) return 'card'; if (n.includes('kredi')) return 'loan'; if (n.includes('nakit')) return 'cash';
  if (n.includes('banka')) return 'bank'; if (n.includes('tasarruf') || n.includes('birikim')) return 'savings';
  if (n.includes('yatırım')) return 'invest'; if (n.includes('elektronik')) return 'ewallet'; if (n.includes('sigorta')) return 'insurance';
  return 'other';
}
const mmCutDay = v => { const n = parseInt(v, 10); return !n ? null : n === 1 ? 31 : n - 1; }; // MM period start -> last day included
async function importMM(file) {
  const SQL = await loadSql();
  const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
  const rows = sql => { const r = db.exec(sql); if (!r.length) return []; const {columns, values} = r[0]; return values.map(v => Object.fromEntries(columns.map((c, i) => [c, v[i]]))); };
  const tables = new Set(rows("select name from sqlite_master where type='table'").map(r => r.name));
  if (!tables.has('ZINOUTCOME') || !tables.has('ZASSET')) throw new Error('Bu dosya bir Money Manager yedeği gibi görünmüyor');
  const active = 'coalesce(ZISDEL,0)=0';
  const groups = new Map(rows('select ZUID, ZASSETGROUPNAME from ZASSETGROUP').map(g => [String(g.ZUID), g.ZASSETGROUPNAME]));
  const accounts = rows('select ZUID, ZNICNAME, ZGROUPUID, ZISDEL, ZCARDASSETUID, ZORDER, ZCARD_DAYFIN, ZCARD_DAYPAY from ZASSET').map(a => {
    const id = 'mm-' + a.ZUID, type = groupType(String(a.ZGROUPUID), groups.get(String(a.ZGROUPUID)));
    return {id, name:String(a.ZNICNAME || 'Hesap').trim(), type, parentId:a.ZCARDASSETUID ? 'mm-' + a.ZCARDASSETUID : null,
      opening:0, limit:null, color:hashColor(a.ZUID + a.ZNICNAME), // MM: 0 = active; any other value = deleted by the user (MM no longer shows it, but its transactions still count)
      deleted:(+a.ZISDEL || 0) !== 0, hidden:false, order:a.ZORDER ?? 0,
      // MM: ZCARD_DAYFIN = first day of the new period (cut is the day before, 23:59), ZCARD_DAYPAY = due day
      statementDay:type === 'card' ? mmCutDay(a.ZCARD_DAYFIN) : null, dueDay:type === 'card' ? (parseInt(a.ZCARD_DAYPAY, 10) || null) : null};

  });
  const accIds = new Set(accounts.map(a => a.id));
  for (const a of accounts) if (a.parentId && !accIds.has(a.parentId)) a.parentId = null;
  const txRows = rows(`select ZUID, ZDO_TYPE, ZAMOUNT, ZASSETUID, ZTOASSETUID, ZCATEGORYUID, ZTXDATESTR, ZDATE, ZCONTENT, ZMEMO from ZINOUTCOME where ${active} and ZDO_TYPE in ('0','1','3','7','8')`);
  const usedCats = new Set(txRows.map(t => String(t.ZCATEGORYUID)));
  let ci = 0;
  const cats = rows('select ZUID, ZNAME, ZPUID, ZDOTYPE, ZISDEL, ZORDER from ZCATEGORY').filter(c => c.ZISDEL !== 1 || usedCats.has(String(c.ZUID)) ).map(c => ({
    id:'mm-' + c.ZUID, name:String(c.ZNAME || '').trim(), kind:String(c.ZDOTYPE) === '0' ? 'income' : 'expense',
    parentId:c.ZPUID && c.ZPUID !== '0' ? 'mm-' + c.ZPUID : null, emoji:guessEmoji(c.ZNAME), hidden:c.ZISDEL === 1, order:c.ZORDER ?? ci++, color:null
  }));
  const catIds = new Set(cats.map(c => c.id));
  for (const c of cats) if (c.parentId && !catIds.has(c.parentId)) c.parentId = null;
  // children hidden only matters for picker; color top-level categories from palette in order
  for (const kind of ['expense', 'income']) cats.filter(c => !c.parentId && c.kind === kind && !c.hidden).sort((a, b) => a.order - b.order).forEach((c, i) => c.color = CAT_COLORS[i % CAT_COLORS.length]);
  for (const c of cats) if (!c.parentId && !c.color) c.color = '#94A3B8';
  for (const c of cats) if (!c.color) c.color = cats.find(p => p.id === c.parentId)?.color || '#64748B';
  const txs = [];
  for (const r of txRows) {
    const accId = 'mm-' + r.ZASSETUID; if (!accIds.has(accId)) continue;
    const ty = String(r.ZDO_TYPE), amt = Math.round(Math.abs(+r.ZAMOUNT || 0) * 100) / 100;
    const ts = r.ZDATE ? Math.round((+r.ZDATE + CORE_DATA_EPOCH) * 1000) : 0;
    let date = r.ZTXDATESTR; if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) { const d = new Date(ts); date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    const base = {id:'mm-' + r.ZUID, amount:amt, accountId:accId, toAccountId:null, categoryId:null, date, ts, note:String(r.ZCONTENT || '').trim(), memo:String(r.ZMEMO || '').trim()};
    // income/expense keep their sign: a negative expense is a refund (iade)
    if (ty === '0' || ty === '1') { base.type = ty === '0' ? 'income' : 'expense'; base.amount = Math.round((+r.ZAMOUNT || 0) * 100) / 100; const cid = 'mm-' + r.ZCATEGORYUID; base.categoryId = catIds.has(cid) ? cid : null; }
    else if (ty === '3') { const to = 'mm-' + r.ZTOASSETUID; if (!accIds.has(to)) continue; base.type = 'transfer'; base.toAccountId = to; }
    else { base.type = 'adjust'; base.amount = ty === '7' ? amt : -amt; if (base.note === 'Bakiye Farkı') base.note = ''; }
    txs.push(base);
  }
  db.close();
  return {version:1, accounts, categories:cats, txs, meta:{importedAt:Date.now(), source:file.name}};
}
$('#file-mm').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (S.txs.length && !confirm(`Mevcut hesaplar, kategoriler ve işlemler (${S.txs.length}) Money Manager yedeğiyle değiştirilecek. Tekrarlayan işlem tanımların ve onlardan oluşan kayıtlar korunur. Devam edilsin mi?`)) return;
  $('#loading').classList.add('on');
  try {
    const data = await importMM(f);
    // keep recurring rules (and what they generated) whose accounts still exist in the backup
    const ids = new Set(data.accounts.map(a => a.id));
    const rules = (S.rules || []).filter(r => ids.has(r.accountId) && (!r.toAccountId || ids.has(r.toAccountId)));
    const keep = new Set(rules.map(r => r.id));
    data.txs.push(...S.txs.filter(t => keep.has(t.recurringId)));
    // keep icons the user chose: category defaults and per-transaction overrides (ids are stable across imports)
    const oldCat = new Map(S.categories.map(c => [c.id, c.emoji])), oldTx = new Map(S.txs.filter(t => t.icon).map(t => [t.id, t.icon]));
    for (const c of data.categories) if (oldCat.get(c.id)) c.emoji = oldCat.get(c.id);
    for (const t of data.txs) if (oldTx.get(t.id)) t.icon = oldTx.get(t.id);
    S = {...emptyState(), ...data, rules, icons:S.icons || {}, meta:{...S.meta, ...data.meta}};
    await DB.set('state', S);
    ui.tab = 'home'; ui.month = curMonth(); render();
    toast(`${data.accounts.length} hesap, ${data.categories.length} kategori, ${data.txs.length.toLocaleString('tr-TR')} işlem aktarıldı`);
  } catch (err) { console.error(err); toast('Aktarılamadı: ' + err.message); }
  finally { $('#loading').classList.remove('on'); }
});

/* ---------- boot ---------- */
(async () => {
  try { const st = await DB.get('state'); if (st) S = {...emptyState(), ...st}; } catch (e) { toast('Veritabanı açılamadı'); }
  // one-time fix: the first release stored Money Manager's "new period starts" day as the cut day
  if (!S.meta.cutDayFix) {
    for (const a of S.accounts) if (a.type === 'card' && a.statementDay && String(a.id).startsWith('mm-')) a.statementDay = mmCutDay(a.statementDay);
    S.meta.cutDayFix = true; if (S.accounts.length) save();
  }
  const n = runRecurring();
  render();
  if (n) toast(`${n} tekrarlayan işlem eklendi`);
  // a PWA can stay open for days: re-check due items whenever it comes back to the foreground
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || sheetState) return;
    const k = runRecurring();
    if (k || D?.today !== todayStr()) render();
    if (k) toast(`${k} tekrarlayan işlem eklendi`);
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
