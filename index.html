<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cüzdan">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070B14" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Cüzdan</title>
<script>try{const t=localStorage.getItem('cz-theme');if(t=='light'||t=='dark')document.documentElement.dataset.theme=t}catch{}</script>
<style>
/* Design tokens follow Apple HIG: system semantic colors (light / dark / increased contrast),
   the iOS text-style scale in rem so Safari's Dynamic Type (-apple-system-body) scales everything. */
:root{
  /* iOS text styles at the default size (body = 17pt = 1rem) */
  --t-large:2rem; --t-title1:1.647rem; --t-title2:1.294rem; --t-title3:1.176rem; --t-body:1rem;
  --t-callout:.941rem; --t-sub:.882rem; --t-foot:.765rem; --t-cap:.706rem; --t-cap2:.647rem;

  /* systemGroupedBackground family + labels */
  --bg:#F3F5F9; --card:#FFFFFF; --card2:#F3F5F9; --card-elev:#FFFFFF; --sheet:#F3F5F9;
  --text:#0B1220; --muted:#5B6476; --muted2:#8A93A6; --line:rgba(15,23,42,.12); --chip:rgba(100,116,139,.12);
  /* tint + status colors: text variants meet 4.5:1 on white, fill variants are the vivid system hues */
  --accent:#1D4ED8; --accent-fill:#2563EB; --on-accent:#FFFFFF;
  --pos:#047857; --neg:#C81E1E; --warn:#B45309;
  --pos-fill:#10B981; --neg-fill:#EF4444; --warn-fill:#F59E0B;
  --hero1:#0B1530; --hero2:#2547C9; --hero3:#047A64;
  --card-shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --num-font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* Liquid Glass approximation for the control layer only (tab bar, nav buttons, sheet controls, toast) */
  --glass:rgba(255,255,255,.66); --glass-hi:rgba(255,255,255,.85); --glass-edge:rgba(255,255,255,.7);
  --glass-shadow:0 8px 28px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.07);
  --glass-blur:blur(18px) saturate(190%);
  --shadow:none;
  color-scheme:light dark;
}
/* Appearance: follows the system unless the user picked Açık/Koyu in Ayarlar (html[data-theme]) */
:root[data-theme=light]{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){color-scheme:dark;
    --bg:#070B14; --card:#121A2B; --card2:#1B2538; --card-elev:#1B2538; --sheet:#121A2B;
    --text:#F1F5FB; --muted:#9AA6BC; --muted2:#6F7B92; --line:rgba(148,163,184,.18); --chip:rgba(148,163,184,.14);
    --accent:#7AA2FF; --accent-fill:#3B6CF6;
    --pos:#34D399; --neg:#F87171; --warn:#FBBF24;
    --pos-fill:#10B981; --neg-fill:#EF4444; --warn-fill:#F59E0B; --card-shadow:none;
    --glass:rgba(22,30,48,.62); --glass-hi:rgba(90,110,150,.28); --glass-edge:rgba(255,255,255,.14);
    --glass-shadow:0 8px 28px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme=dark]{color-scheme:dark;
    --bg:#070B14; --card:#121A2B; --card2:#1B2538; --card-elev:#1B2538; --sheet:#121A2B;
    --text:#F1F5FB; --muted:#9AA6BC; --muted2:#6F7B92; --line:rgba(148,163,184,.18); --chip:rgba(148,163,184,.14);
    --accent:#7AA2FF; --accent-fill:#3B6CF6;
    --pos:#34D399; --neg:#F87171; --warn:#FBBF24;
    --pos-fill:#10B981; --neg-fill:#EF4444; --warn-fill:#F59E0B; --card-shadow:none;
    --glass:rgba(22,30,48,.62); --glass-hi:rgba(90,110,150,.28); --glass-edge:rgba(255,255,255,.14);
    --glass-shadow:0 8px 28px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
}
/* HIG: every custom color needs an increased-contrast variant */
@media (prefers-contrast:more){
  :root{--muted:#3A3A3C; --line:rgba(60,60,67,.55); --accent:#0040DD; --pos:#006B1E; --neg:#A8000F; --glass:rgba(255,255,255,.94); --glass-edge:rgba(0,0,0,.35)}
}
@media (prefers-contrast:more) and (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--muted:#C7C7CC; --line:rgba(255,255,255,.4); --accent:#6EB5FF; --pos:#6EF08A; --neg:#FF8A8D; --glass:rgba(28,28,30,.96); --glass-edge:rgba(255,255,255,.45)}
}
@media (prefers-contrast:more){
  :root[data-theme=dark]{--muted:#C7C7CC; --line:rgba(255,255,255,.4); --accent:#6EB5FF; --pos:#6EF08A; --neg:#FF8A8D; --glass:rgba(28,28,30,.96); --glass-edge:rgba(255,255,255,.45)}
}
/* HIG: Reduce Transparency → opaque control surfaces */
@media (prefers-reduced-transparency:reduce){
  :root{--glass:var(--card); --glass-blur:none}
}

/* Dynamic Type: Safari maps -apple-system-body to the user's text size (17px at the default size) */
html{font-size:17px}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);touch-action:manipulation}
button,a,input,select{touch-action:manipulation}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;font-size:var(--t-body);line-height:1.3;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button{transition:opacity .12s ease-out,transform .12s ease-out,background-color .2s ease-out,color .2s ease-out}
button:active{opacity:.6;transition-duration:0s}
/* keyboard focus (iPad/Mac keyboard, Full Keyboard Access): visible ring on every control */
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px}
#sheet:focus-visible{outline:none}
.field:has(input:not([type=checkbox]):focus,select:focus),.search:focus-within,.custom-emoji input:focus{box-shadow:inset 0 0 0 2px var(--accent-fill)}
.field input:focus-visible,.field select:focus-visible,.search input:focus-visible,.custom-emoji input:focus-visible,.amount input:focus-visible{outline:none}
input,select,textarea{font:inherit;color:inherit;font-size:max(16px,1rem)}
.num{font-variant-numeric:tabular-nums;font-family:var(--num-font)}
#view{padding:4px 16px calc(112px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
@media (min-width:700px){#view{padding-left:20px;padding-right:20px}}

/* scroll edge effect under the status bar (instead of a solid bar) */
.edge-top{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 14px);z-index:15;pointer-events:none;
  background:linear-gradient(var(--bg) 35%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.edge-bottom{position:fixed;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom));z-index:19;pointer-events:none;
  background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 70%,transparent))}

/* Navigation bar: toolbar buttons on top, large title below (iOS large-title layout) */
header.big{display:grid;grid-template-columns:1fr auto;grid-template-areas:"lead trail" "eyebrow eyebrow" "title title";align-items:center;
  column-gap:12px;padding:8px 0 10px;min-height:44px}
header.big>div{display:contents}
header.big h1{grid-area:title;font-size:var(--t-large);line-height:1.2;letter-spacing:.012em;margin:4px 0 0;font-weight:700;overflow-wrap:anywhere}
header.big .back{grid-area:lead;justify-self:start}
header.big>.icon-btn{grid-area:trail;justify-self:end}
.eyebrow{grid-area:eyebrow;font-size:var(--t-foot);color:var(--muted);font-weight:600;margin-top:6px}
header.big>div>.eyebrow:first-child{margin-top:10px}

/* glass circle toolbar button — 44×44 target */
.icon-btn,.gbtn{min-width:44px;height:44px;border-radius:22px;display:inline-grid;place-items:center;color:var(--text);
  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 var(--glass-hi),var(--glass-shadow)}
.icon-btn svg,.gbtn svg{width:20px;height:20px}
.gbtn.text{padding:0 16px;font-weight:600;font-size:var(--t-body)}
.gbtn.prominent{background:var(--accent-fill);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--accent-fill) 40%,transparent)}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 14px 0 8px;border-radius:22px;font-weight:500;font-size:var(--t-body);color:var(--text);max-width:70vw;
  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 0 0 .5px var(--glass-edge),inset 0 1px 0 var(--glass-hi),var(--glass-shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back svg{width:20px;height:20px;flex:0 0 auto}

/* summary card (content layer: solid, no glass) */
.hero{border-radius:28px;padding:22px 20px 18px;box-shadow:0 12px 32px -12px color-mix(in srgb,var(--hero2) 55%,transparent);color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,var(--hero2) 0%,transparent 58%),radial-gradient(120% 120% at 0% 100%,var(--hero3) 0%,transparent 55%),var(--hero1)}
.hero .label{font-size:var(--t-sub);color:rgba(255,255,255,.78);font-weight:600}
.hero .big-amt{font-size:calc(var(--t-large) * 1.25);font-weight:700;letter-spacing:.01em;margin:2px 0 16px;line-height:1.2;overflow-wrap:anywhere}
.hero .big-amt small{font-size:var(--t-title3);color:rgba(255,255,255,.7);font-weight:600}
.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-row div{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px;min-width:0}
.hero-row span{display:block;font-size:var(--t-foot);color:rgba(255,255,255,.78)}
.hero-row b{font-size:var(--t-body);font-weight:600}
.hero-row b+span{margin-top:3px;font-size:var(--t-cap);color:rgba(255,255,255,.82)}
.hero-row em{font-style:normal;font-weight:700}
.hero-row em.late{color:#FFB3B5}
.hero-btn{display:block;width:100%;min-height:50px;border-radius:25px;background:#fff;color:#0E1A3A;font-weight:600;margin-top:14px}
.hero-hint{display:block;color:#fff;font-weight:600;font-size:var(--t-sub);text-align:left;min-height:44px}

/* hero: net worth + asset/debt split */
.hero-split{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin:-6px 0 12px;background:rgba(255,255,255,.14)}
.hero-split i{display:block;height:100%}
.hero-split .as{background:#6EE7B7}.hero-split .db{background:#FCA5A5}
.hero-row .k{display:flex;align-items:center;gap:6px}
.hero-row .k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--kc)}

/* this period: income / expense / net in one card */
.flow-card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--card-shadow)}
.flow-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flow-top>div{display:flex;align-items:center;gap:10px;min-width:0}
.flow-ic{font-style:normal;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.flow-ic svg{width:20px;height:20px}
.flow-ic.in{background:color-mix(in srgb,var(--pos-fill) 16%,transparent);color:var(--pos)}
.flow-ic.out{background:color-mix(in srgb,var(--neg-fill) 16%,transparent);color:var(--neg)}
.flow-top span{display:block;font-size:var(--t-foot);color:var(--muted);font-weight:500}
.flow-top b{display:block;font-size:var(--t-title3);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-top .chg{margin-top:1px}
.flow-net{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line)}
.flow-net span{font-size:var(--t-sub);color:var(--muted);font-weight:500}
.flow-net b{font-size:var(--t-title2);font-weight:700}
.save-bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--neg-fill) 22%,transparent);margin-top:10px;overflow:hidden}
.save-bar i{display:block;height:100%;border-radius:inherit;background:var(--neg-fill)}
.save-note{font-size:var(--t-foot);color:var(--muted);margin-top:6px}
.save-note b{color:var(--text);font-weight:600}

/* category distribution: one 100% stacked bar + ranked rows (replaces the donut) */
.dist-total{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:-2px 0 10px}
.dist-total span{font-size:var(--t-foot);color:var(--muted);font-weight:500}
.dist-total b{font-size:var(--t-title2);font-weight:700}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:8px}
.stack i{display:block;height:100%;min-width:3px}
.dist{display:flex;flex-direction:column}
.dist .r{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ic n v" "ic bar bar";column-gap:10px;row-gap:5px;align-items:center;width:100%;text-align:left;padding:8px 0;min-height:44px}
.dist .r+.r{border-top:.5px solid var(--line)}
.dist .ic{grid-area:ic;width:34px;height:34px;border-radius:10px;font-size:18px}
.dist .n{grid-area:n;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--t-callout);font-weight:500}
.dist .v{grid-area:v;text-align:right;font-weight:600;font-size:var(--t-callout);white-space:nowrap}
.dist .v small{color:var(--muted);font-weight:500;font-size:var(--t-foot);margin-left:6px}
.dist .bar{grid-area:bar;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.dist .bar i{display:block;height:100%;border-radius:inherit}
.dist .r.less{display:block;text-align:center;color:var(--accent);font-weight:600;font-size:var(--t-sub)}
html.ax .flow-top{grid-template-columns:1fr}
html.ax .dist .n,html.ax .flow-top b{white-space:normal}

/* period switcher */
.month{display:flex;align-items:center;justify-content:center;gap:4px;margin:16px 0 12px}
.month button{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--accent)}
.month button svg{width:20px;height:20px}
.month button:disabled{opacity:.3}
.month span,.month .mlabel{min-width:150px;text-align:center;font-weight:600;font-size:var(--t-body);width:auto;height:auto;min-height:44px;border-radius:22px;display:block;color:var(--text);padding:6px 14px;background:var(--chip)}
.month .mlabel .caret{font-style:normal;font-size:var(--t-cap2);color:var(--muted);margin-left:5px;vertical-align:2px}
.month .mlabel small,.month span small{display:block;font-size:var(--t-cap);color:var(--muted);font-weight:500;margin-top:1px}
.to-today{display:flex;justify-content:center;margin:-4px 0 10px}
.to-today button{font-size:var(--t-sub);font-weight:600;color:var(--accent);background:var(--chip);min-height:36px;padding:0 16px;border-radius:18px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 16px}
.mgrid button{min-height:52px;border-radius:16px;background:var(--card);font-weight:600;font-size:var(--t-sub);position:relative;text-transform:capitalize}
.mgrid button.now{box-shadow:inset 0 0 0 1.5px var(--accent)}
.mgrid button.on{background:var(--accent-fill);color:#fff}
.mgrid button i{position:absolute;bottom:7px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--muted2)}
.mgrid button.on i{background:#fff}

/* backup reminder */
.backup-banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.backup-banner .bb-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;color:var(--accent);background:color-mix(in srgb,var(--accent-fill) 16%,transparent)}
.backup-banner .bb-ic svg{width:22px;height:22px}
.backup-banner .bb-t{flex:1;min-width:0}
.backup-banner .bb-t b{display:block;font-size:var(--t-body);font-weight:600}
.backup-banner .bb-t small{display:block;color:var(--muted);font-size:var(--t-foot);margin-top:2px}
.backup-banner .bb-actions{display:flex;gap:8px;width:100%}
.backup-banner .bb-actions button{flex:1;min-height:44px;border-radius:22px;background:var(--chip);font-weight:600;font-size:var(--t-sub)}
.backup-banner .bb-actions button.on{background:var(--accent-fill);color:#fff}

/* budget meters */
.bbar{height:6px;border-radius:3px;background:var(--chip);margin-top:8px;position:relative}
.bbar.big{height:10px;border-radius:5px;background:rgba(255,255,255,.22)}
.bbar i{display:block;height:100%;border-radius:inherit;background:var(--pos-fill)}
.bbar.warn i{background:var(--warn-fill)} .bbar.over i{background:var(--neg-fill)}
.bbar em{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--text);opacity:.55;border-radius:1px}
.hero .bbar em{background:#fff}
.warn-t{color:var(--warn) !important}
.budget-card{display:block;width:100%;text-align:left}
.budget-card .bc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.budget-card .bc-head h3{margin:0}
.budget-card .bc-head span{font-weight:600}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;margin:-10px 0 4px;text-align:left}
.card-head h3{margin:0 !important}
.card-head span{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sub);color:var(--accent);font-weight:500}
.card-head .chev{color:var(--accent);opacity:1}
.chg{display:block;font-size:var(--t-cap);font-weight:600;margin-top:2px}
.tile .chg{display:inline-block;margin-top:2px;font-size:var(--t-cap);font-weight:600}
.chg.pos{color:var(--pos) !important} .chg.neg{color:var(--neg) !important}
.pbar{height:5px;border-radius:3px;background:var(--chip);margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.pbar i.g{background:var(--pos-fill)} .pbar i.e{background:var(--neg-fill)}
.period-row.cur{background:color-mix(in srgb,var(--accent-fill) 8%,transparent)}
.period-row .a span{display:block;font-weight:500}
.period-row .a small.pos{color:var(--pos)} .period-row .a small.neg{color:var(--neg)}
.budget-card .bc-sub{font-size:var(--t-foot);color:var(--muted);margin-top:6px}

/* chart window switcher */
.chart-nav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 10px;background:var(--chip);border-radius:22px;padding:2px}
.chart-nav button{width:44px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--accent)}
.chart-nav button:disabled{opacity:.3}
.chart-nav span{font-size:var(--t-foot);font-weight:600;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:18px;padding:12px 14px;min-width:0}
.tile span{font-size:var(--t-foot);color:var(--muted);font-weight:500}
.tile b{display:block;font-size:var(--t-body);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.row-actions{display:flex;gap:8px;padding:0 16px 12px 64px}
.row-actions button{flex:1;min-height:40px;border-radius:20px;background:var(--chip);font-weight:600;font-size:var(--t-sub)}
.row-actions button.on{background:var(--accent-fill);color:#fff}
.empty p{margin:0 0 20px;line-height:1.5}
.ic{overflow:hidden}
.ico-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.ico-img.inline{width:1.1em;height:1.1em;border-radius:5px;display:inline-block;vertical-align:-.2em}
.tx-icon{display:flex;flex-direction:column;align-items:center;gap:6px;margin:2px auto -4px;min-height:44px}
.tx-icon .ic-big{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:32px;overflow:hidden}
.tx-icon small{font-size:var(--t-foot);color:var(--accent);font-weight:600}
.ico-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin-bottom:18px}
.ico-tile{aspect-ratio:1;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:26px;position:relative;overflow:hidden}
.ico-tile.on{box-shadow:inset 0 0 0 2.5px var(--accent-fill)}
.ico-tile.add{color:var(--accent);font-size:26px;border:1.5px dashed var(--muted2);background:none}

/* tab bar: floating Liquid Glass capsule; the add action sits apart from it (HIG: tabs are never actions) */
nav.tabs{position:fixed;z-index:20;bottom:max(10px,calc(env(safe-area-inset-bottom) - 12px));
  left:max(16px,calc(50% - 324px));right:calc(max(16px,calc(50% - 324px)) + 74px);height:62px;padding:4px;border-radius:31px;
  display:grid;grid-template-columns:repeat(4,1fr);align-items:stretch;

nav.tabs button svg{width:26px;height:26px}
nav.tabs button .f{display:none}
nav.tabs button.on{color:var(--accent);background:var(--chip)}
nav.tabs button.on .o{display:none}
nav.tabs button.on .f{display:block}
nav.tabs button:active{opacity:1;transform:scale(.96)}
.fab{position:fixed;z-index:20;bottom:max(10px,calc(env(safe-area-inset-bottom) - 12px));right:max(16px,calc(50% - 324px));

/* sheet: large detent, rounded top, opaque at full height; controls on glass */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sheet);border-radius:38px 38px 0 0;max-height:calc(100vh - env(safe-area-inset-top) - 10px);overflow-y:auto;

.form{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:14px}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}

}

html.ax .row .t b,html.ax .row .t small,html.ax .legend .n,html.ax .tile b,html.ax .cat-meta b,html.ax .link-sum b{white-space:normal;overflow:visible}

/* ---------- credit card cycle ---------- */
function balAt(id, date) {

/* ---------- linked groups ----------
   Kredi, Yatırım and Borç each have an income and an expense category that belong together: buying gold
   (expense) and selling it (income) are the same "Yatırım" category seen from two sides. Opening one lists both,
   with the net. Linking is by name only; everything still counts in the regular income/expense totals. */
const LINKS = {loan:{name:'Kredi', emoji:'🏦', color:'#E5484D'}, invest:{name:'Yatırım', emoji:'📈', color:'#12A26B'}, debt:{name:'Borç', emoji:'🤝', color:'#F5A524'}};

// every group needs one income and one expense category: adopt one with the group's name, else create it
function ensureLinks() {
  const tr = v => String(v || '').trim().toLocaleLowerCase('tr');
  // the link follows the name: an income and an expense category called e.g. "Yatırım" are one category
  for (const c of S.categories) { const k = Object.keys(LINKS).find(k => tr(LINKS[k].name) === tr(c.name)); if (k) c.link = k; else if (c.link && !String(c.id).startsWith('cz-')) delete c.link; }
  for (const [key, L] of Object.entries(LINKS)) for (const kind of ['income', 'expense']) {
    if (S.categories.some(c => c.kind === kind && c.link === key)) continue;
    const named = S.categories.filter(c => c.kind === kind && tr(c.name) === tr(L.name)).sort((a, b) => (!!a.parentId - !!b.parentId) || (!!a.hidden - !!b.hidden))[0];
    if (named) { named.link = key; named.hidden = false; }
    else S.categories.push({id:`cz-${key}-${kind}`, name:L.name, kind, parentId:null, emoji:L.emoji, color:L.color, hidden:false, order:900, link:key});
  }
  // the auto-made category becomes redundant once the user has their own one with the same name (e.g. created later
  // in Money Manager): move everything onto the user's category and drop the duplicate
  for (const [key] of Object.entries(LINKS)) for (const kind of ['income', 'expense']) {
    const auto = S.categories.find(c => c.id === `cz-${key}-${kind}`);
    const own = S.categories.filter(c => c.kind === kind && c.link === key && c !== auto).sort((a, b) => (!!a.parentId - !!b.parentId) || (!!a.hidden - !!b.hidden))[0];
    if (!auto || !own) continue;
    for (const t of S.txs) if (t.categoryId === auto.id) t.categoryId = own.id;
    for (const r of S.rules || []) if (r.categoryId === auto.id) r.categoryId = own.id;
    for (const c of S.categories) if (c.parentId === auto.id) c.parentId = own.id;
    if (S.budgets?.[auto.id] != null) { if (S.budgets[own.id] == null) S.budgets[own.id] = S.budgets[auto.id]; delete S.budgets[auto.id]; }
    for (const k of Object.keys(S.noteIcons || {})) if (k.startsWith(auto.id + '|')) { const nk = own.id + k.slice(auto.id.length); if (!S.noteIcons[nk]) S.noteIcons[nk] = S.noteIcons[k]; delete S.noteIcons[k]; }
    if (!own.emoji && auto.emoji) own.emoji = auto.emoji;

    return {id, v, attr:drillOf ? drillOf(id) : c && !n ? `data-action="cat-drill" data-id="${id}"` : '', name:n || c?.name || 'Kategorisiz', emoji:iconOf ? iconOf(id) || '' : n ? '' : c?.emoji || '',
      color:(nameOf || i >= CAT_COLORS.length ? colorAt(i) : c?.color) || '#64748B'}; });
  const more = `data-action="donut-more" data-k="${esc(title)}"`;
  if (!open && many) segs.push({id:'_rest', v:sorted.slice(LIMIT).reduce((s, x) => s + x[1], 0), name:`Diğerleri (${sorted.length - LIMIT})`, color:'#94A3B8', attr:more});
  const pct = v => Math.max(1, Math.round(v / total * 100)), top = segs[0]?.v || 1;
  return `<section class="card"><h3>${title}</h3>
    <div class="dist-total"><span>Toplam</span><b class="num">${money(total, false)}</b></div>
    <div class="stack" role="img" aria-label="${esc(segs.map(s => `${s.name} %${pct(s.v)}`).join(', '))}">${segs.map(s => `<i style="width:${s.v / total * 100}%;background:${s.color}"></i>`).join('')}</div>
    <div class="dist">${segs.map(s => `<button class="r" ${s.attr || ''}>
      <span class="ic" style="background:color-mix(in srgb,${s.color} 16%,transparent)">${s.emoji ? ico(s.emoji) : `<i class="dot" style="width:10px;height:10px;border-radius:50%;background:${s.color}"></i>`}</span>
      <span class="n">${esc(s.name)}</span><span class="v num">${money(s.v, false)}<small>%${pct(s.v)}</small></span>
      <span class="bar" aria-hidden="true"><i style="width:${s.v / top * 100}%;background:${s.color}"></i></span></button>`).join('')}
      ${open && many ? `<button class="r less" ${more}>Daha az göster</button>` : ''}</div>
  </section>`;
}
function flowCard(st, prev) {
  const net = st.inc - st.exp, used = st.inc > 0.004 ? Math.min(st.exp / st.inc, 1) : (st.exp > 0.004 ? 1 : 0);
  const rate = st.inc > 0.004 ? Math.round(net / st.inc * 100) : null;
  return `<section class="flow-card" aria-label="Bu dönem">
    <div class="flow-top">
      <div><i class="flow-ic in">${FLOW_IN}</i><div style="min-width:0"><span>Gelir</span><b class="num pos">${money(st.inc, false)}</b>${changeTag(st.inc, prev.inc, true)}</div></div>
      <div><i class="flow-ic out">${FLOW_OUT}</i><div style="min-width:0"><span>Gider</span><b class="num neg">${money(st.exp, false)}</b>${changeTag(st.exp, prev.exp, false)}</div></div>
    </div>
    <div class="flow-net"><span>Fark</span><b class="num ${net >= 0 ? 'pos' : 'neg'}">${net > 0 ? '+' : ''}${money(net, false)}</b></div>
    ${st.inc > 0.004 || st.exp > 0.004 ? `<div class="save-bar" aria-hidden="true"><i style="width:${used * 100}%"></i></div>
    <div class="save-note">${rate == null ? 'Bu dönem gelir yok' : rate >= 0 ? `Harcanan <b class="num">%${100 - rate}</b> · Kalan <b class="num">%${rate}</b>` : `Gider, geliri <b class="num">%${-rate}</b> aştı`}</div>` : ''}
  </section>`;
}

      <div class="bc-sub num">${money(T.s, false)} / ${money(T.b, false)}${T.over ? ` · <b class="neg">${T.over} kategori aşıldı</b>` : ''}</div>${bbar(T.s, T.b, prog, true)}</button>`; })()}

// Özet cards keep their charts; tapping a card's title opens its detail page
const linkHead = (html, title, action, k) => html.replace(`<h3>${title}</h3>`,
  `<button class="card-head" data-action="${action}"${k ? ` data-k="${k}"` : ''}><h3>${title}</h3><span>Ayrıntılar${ICON.rowChev}</span></button>`);
const pctChange = (now, prev) => prev > 0.004 ? (now - prev) / prev * 100 : null;
function changeTag(now, prev, goodUp) {
  const p = pctChange(now, prev); if (p == null || Math.abs(p) < 0.5) return '';
  const up = p > 0, good = up === goodUp;
  return `<span class="chg ${good ? 'pos' : 'neg'}">${up ? '▲' : '▼'} %${Math.round(Math.abs(p))}</span>`;
}

// Gider / gelir dağılımı detail: totals vs previous period and 6-period average, full donut, every category with its trend
VIEWS.flow = () => {
  const inc = ui.flowKind === 'inc', key = inc ? 'incCats' : 'cats', sumKey = inc ? 'inc' : 'exp';
  const title = inc ? 'Gelir dağılımı' : 'Gider dağılımı';
  const st = monthStats(ui.month), prevM = shiftMonth(ui.month, -1), prev = monthStats(prevM);
  const hist = Array.from({length:6}, (_, i) => monthStats(shiftMonth(ui.month, -1 - i)));
  const avgOf = f => { const v = hist.map(f).filter(x => x > 0.004); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
  const tot = st[sumKey], ptot = prev[sumKey], atot = avgOf(h => h[sumKey]);
  const rows = [...st[key].entries()].filter(e => e[1] > 0.004).sort((a, b) => b[1] - a[1]);
  // categories that had money last period but none now
  const gone = [...prev[key].entries()].filter(([id, v]) => v > 0.004 && !(st[key].get(id) > 0.004));
  const row = (id, v, i) => {
    const c = D.cat.get(id), pv = prev[key].get(id) || 0, av = avgOf(h => h[key].get(id) || 0);
    const color = (i < CAT_COLORS.length ? c?.color : `hsl(${(i * 47) % 360} 60% 55%)`) || '#64748B'; // same as the donut
    return `<button class="row" ${c ? `data-action="cat-drill" data-id="${id}"` : ''}><div class="ic" style="background:${(c?.color || '#64748B')}22">${ico(c?.emoji || '•')}</div>
      <div class="t"><b>${esc(c?.name || 'Kategorisiz')}</b><small class="num">Payı %${tot ? Math.round(v / tot * 100) : 0}</small><small class="num">Önceki ${pv ? money(pv, false) : '—'} · Ort. ${av ? money(av, false) : '—'}</small>
      <div class="meter"><i style="width:${tot ? v / tot * 100 : 0}%;background:${color}"></i></div></div>
      <div class="a num">${money(v, false)}${changeTag(v, pv, inc)}</div>${ICON.rowChev}</button>`;
  };
  return `<header class="big"><div>${backBtn()}<h1>${title}</h1></div></header>
  ${monthSwitch()}
  <div class="tiles">
    <div class="tile"><span>Bu dönem</span><b class="num ${inc ? 'pos' : 'neg'}">${money(tot, false)}</b></div>
    <div class="tile"><span>Önceki dönem</span><b class="num">${ptot ? money(ptot, false) : '—'}</b>${changeTag(tot, ptot, inc)}</div>
    <div class="tile"><span>6 dönem ort.</span><b class="num">${atot ? money(atot, false) : '—'}</b>${changeTag(tot, atot, inc)}</div>
  </div>
  ${donutCard('Dağılım', st[key], inc ? 'Bu dönem gelir yok' : 'Bu dönem gider yok')}
  ${homeChart(ui.flowKind)}
  ${rows.length ? `<div class="sec-title">Kategoriler<small>${rows.length} kategori</small></div><div class="list">${rows.map(([id, v], i) => row(id, v, i)).join('')}</div>` : ''}
  ${gone.length ? `<div class="sec-title">Bu dönem hiç olmayanlar</div><div class="list">${gone.map(([id, pv]) => { const c = D.cat.get(id);
    return `<button class="row" ${c ? `data-action="cat-drill" data-id="${id}"` : ''}><div class="ic" style="background:${(c?.color || '#64748B')}22">${ico(c?.emoji || '•')}</div><div class="t"><b>${esc(c?.name || 'Kategorisiz')}</b><small class="num">önceki ${money(pv, false)}</small></div><div class="a num">${money(0, false)}</div>${ICON.rowChev}</button>`; }).join('')}</div>` : ''}
  <p class="note">▲▼ önceki döneme göre değişim. Ortalama, son 6 dönemden harcama olanların ortalamasıdır.</p>`;
};

// Gelir ve gider detail: the 12-period chart plus every period's numbers and totals
VIEWS.trend = () => {
  if (!ui.homeEnd) ui.homeEnd = ui.month;
  const chart = homeChart(), end = ui.homeEnd;
  const ser = Array.from({length:12}, (_, i) => shiftMonth(end, -i)).map(m => ({m, ...monthStats(m)}));
  const ti = ser.reduce((s, x) => s + x.inc, 0), te = ser.reduce((s, x) => s + x.exp, 0);
  const rate = ti > 0.004 ? Math.round((ti - te) / ti * 100) : null;
  const act = ser.filter(x => x.inc > 0.004 || x.exp > 0.004);
  const best = act.length ? act.reduce((a, b) => (b.inc - b.exp > a.inc - a.exp ? b : a)) : null;
  const worst = act.length ? act.reduce((a, b) => (b.inc - b.exp < a.inc - a.exp ? b : a)) : null;
  const maxV = Math.max(1, ...ser.map(x => Math.max(x.inc, x.exp)));
  return `<header class="big"><div>${backBtn()}<h1>Gelir ve gider</h1></div></header>
  ${monthSwitch()}
  ${chart}
  <div class="tiles" style="margin-top:14px">
    <div class="tile"><span>12 dönem gelir</span><b class="num pos">${money(ti, false)}</b></div>
    <div class="tile"><span>12 dönem gider</span><b class="num neg">${money(te, false)}</b></div>
    <div class="tile"><span>Birikim oranı</span><b class="num ${rate != null && rate < 0 ? 'neg' : ''}">${rate == null ? '—' : `%${rate}`}</b></div>
  </div>
  ${best && act.length > 1 ? `<div class="link-sum" style="grid-template-columns:1fr 1fr"><span>En iyi dönem · ${esc(monthLabel(best.m))}<b class="num pos">${best.inc - best.exp >= 0 ? '+' : '−'}${money(Math.abs(best.inc - best.exp), false)}</b></span><span>En zayıf dönem · ${esc(monthLabel(worst.m))}<b class="num ${worst.inc - worst.exp < 0 ? 'neg' : ''}">${worst.inc - worst.exp >= 0 ? '+' : '−'}${money(Math.abs(worst.inc - worst.exp), false)}</b></span></div>` : ''}
  <div class="sec-title">Dönemler</div>
  <div class="list">${ser.map(x => { const d = x.inc - x.exp;
    return `<button class="row period-row ${x.m === ui.month ? 'cur' : ''}" data-action="goto-month" data-m="${x.m}"><div class="t"><b>${esc(monthLabel(x.m))}</b>
      <div class="pbar"><i class="g" style="width:${x.inc / maxV * 100}%"></i></div><div class="pbar"><i class="e" style="width:${x.exp / maxV * 100}%"></i></div></div>
      <div class="a num"><span class="pos">+${money(x.inc, false)}</span><small>−${money(x.exp, false)}</small><small class="${d >= 0 ? 'pos' : 'neg'}" style="font-weight:600">${d >= 0 ? '+' : '−'}${money(Math.abs(d), false)}</small></div></button>`; }).join('')}</div>
  <p class="note">Bir döneme dokunursan sayfadaki dağılımlar o döneme geçer.</p>`;
};

// "Sıfırdan başla": a few standard accounts and top-level categories (no subcategories); all editable later.

VIEWS.accounts = () => {
  const live = S.accounts.filter(a => !a.deleted);
  const visible = live.filter(a => !a.hidden), hidden = live.filter(a => a.hidden);
  const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
  const accRow = (a, nested) => {
    const v = D.bal.get(a.id) || 0, f = D.future.get(a.id) || 0;
    const color = a.color || hashColor(a.id);
    let sub = ACC_TYPE_ONE[a.type] || '';
    if (a.type === 'card') {
      const c = cardCycle(a);
      sub = c ? (c.dueNow > 0.004 ? `Ödenecek ${money(c.dueNow, false)} · ${relDay(c.due)}` : `Sonraki kesim ${shortDate(c.nextClose)}`)
        : f ? `Gelecek taksitler ${money(Math.abs(f), false)}` : 'Kredi kartı';
    }
    if (a.type === 'bank') sub = 'Banka hesabı';
    const bank = a.type === 'card' && a.parentId ? S.accounts.find(x => x.id === a.parentId && !x.deleted) : null;
    if (bank) sub = `${bank.name} · ${sub}`;
    const meter = a.type === 'card' && a.limit ? `<div class="meter"><i style="width:${Math.min(100, Math.max(0, -v / a.limit * 100))}%"></i></div>` : '';
    return `<button class="row ${nested ? 'nested' : ''}" data-action="open-acc" data-id="${a.id}">
      <div class="ic" style="background:${color}22;color:${color}">${ico(a.icon || ACC_ICON[a.type] || '👛')}</div>
      <div class="t"><b>${esc(a.name)}</b><small>${esc(sub)}</small>${meter}</div>
      <div class="a num ${v < -0.004 ? 'neg' : ''}">${money(v)}</div>${ICON.rowChev}</button>`;
  };
  const section = (title, list) => {
    if (!list.length) return '';
    const sum = list.reduce((s, a) => s + (D.bal.get(a.id) || 0), 0);
    return `<div class="sec-title">${title}<small class="num">${money(sum, false)}</small></div><div class="list">${list.map(x => Array.isArray(x) ? x.map((a, i) => accRow(a, i > 0)).join('') : accRow(x)).join('')}</div>`;
  };
  let html = `<header class="big"><h1>Hesaplar</h1><button class="icon-btn" data-action="add-acc" aria-label="Hesap ekle">${ICON.plus}</button></header>`;
  if (!S.accounts.length) return html + `<div class="empty"><div class="big">${ICON.bank}</div>Henüz hesap yok</div>`;
  html += `<section class="hero" style="padding:18px 20px"><div class="label">Net varlık</div><div class="big-amt num" style="margin-bottom:0">${money(D.assets + D.debts)}</div></section>`;
  // order: cash first, then bank accounts, then credit cards, then the rest
  const ofType = t => visible.filter(a => a.type === t).sort(byOrder);
  html += section(ACC_TYPES.cash, ofType('cash'));
  html += section('Banka hesapları', ofType('bank'));
  html += section('Kredi kartları', ofType('card'));
  for (const t of ['ewallet', 'savings', 'invest', 'insurance', 'other']) html += section(ACC_TYPES[t], visible.filter(a => a.type === t).sort(byOrder));
  { // loans: the schedule-based ones plus any balance-based loan accounts
    const accs = visible.filter(a => a.type === 'loan').sort(byOrder), loans = S.loans || [];
    const sum = -D.loanDebt + accs.reduce((s, a) => s + (D.bal.get(a.id) || 0), 0);
    const lrow = l => { const st = loanState(l);
      const sub = st.overdue ? `${st.overdue} taksit gecikti` : st.next ? `${st.paidCount}/${l.count} ödendi · sonraki ${relDay(st.next.date)}` : 'Tamamı ödendi ✓';
      return `<button class="row" data-action="open-loan" data-id="${l.id}"><div class="ic" style="background:${LINKS.loan.color}22;color:${LINKS.loan.color}">${ico(l.icon || '🏦')}</div>
        <div class="t"><b>${esc(l.name)}</b><small class="${st.overdue ? 'neg' : ''}">${esc(sub)}</small><div class="meter"><i style="width:${st.paidCount / l.count * 100}%;background:${LINKS.loan.color}"></i></div></div>
        <div class="a num ${st.remaining ? 'neg' : ''}">${money(-st.remaining)}</div>${ICON.rowChev}</button>`; };
    html += `<div class="sec-title">Krediler<small class="num">${money(sum, false)}</small></div><div class="list">${loans.map(lrow).join('')}${accs.map(a => accRow(a)).join('')}
      <button class="row" data-action="add-loan"><div class="ic" style="background:var(--chip);color:var(--accent);font-size:20px">＋</div><div class="t"><b style="color:var(--accent);font-weight:600">Kredi ekle</b><small>Taksit planıyla birlikte</small></div></button></div>`;
  }
  if (hidden.length) html += `<details class="hidden-accs"><summary class="sec-title">Gizli hesaplar (${hidden.length})<small>göster</small></summary><div class="list">${hidden.sort(byOrder).map(a => accRow(a)).join('')}</div></details>

  return html;

/* ---------- keeping the data safe ----------
   Data lives only in this device's IndexedDB. Persistent storage tells the OS not to evict it under
   storage pressure; the reminder nudges a JSON backup (to iCloud Drive) at least once a week. */
async function storageStatus() {
  const st = navigator.storage; if (!st) return {supported:false};
  let persisted = false, usage = 0;
  try { persisted = await st.persisted(); } catch {}
  try { usage = (await st.estimate()).usage || 0; } catch {}
  return {supported:true, persisted, usage};
}
async function askPersist() {
  try { if (navigator.storage?.persist) { const ok = await navigator.storage.persist(); S.meta.persist = ok; save(); return ok; } } catch {}
  return false;
}
const fmtBytes = b => b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1024 / 1024).toLocaleString('tr-TR', {maximumFractionDigits:1})} MB`;
function backupBanner() {
  if (!S.txs.length) return '';
  const DAY = 864e5, now = Date.now(), last = S.meta.lastBackup || 0;
  if (now - last < 7 * DAY || now - (S.meta.backupSnooze || 0) < DAY) return '';
  const days = last ? Math.floor((now - last) / DAY) : null;
  return `<section class="backup-banner"><div class="bb-ic">${ICON.cloud}</div><div class="bb-t"><b>Yedek almayı unutma</b><small>${days == null ? 'Henüz hiç yedek almadın.' : `Son yedek ${days} gün önce.`} Veriler yalnızca bu telefonda duruyor.</small></div>
    <div class="bb-actions"><button data-action="backup-later">Yarın hatırlat</button><button class="on" data-action="export-json">Yedek al</button></div></section>`;
}

function loadSql() {

    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js';
    s.onload = () => initSqlJs({locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`}).then(res, rej);
    s.onerror = () => { sqlPromise = null; rej(new Error('İçe aktarıcı yüklenemedi, internet bağlantını kontrol et')); };
    document.head.appendChild(s);
  });
  return sqlPromise;
}

    const id = 'mm-' + a.ZUID, type = groupType(String(a.ZGROUPUID), groups.get(String(a.ZGROUPUID)));
    return {id, name:String(a.ZNICNAME || 'Hesap').trim(), type, parentId:a.ZCARDASSETUID ? 'mm-' + a.ZCARDASSETUID : null,
      opening:0, limit:null, color:hashColor(a.ZUID + a.ZNICNAME), // MM: 0 = active; any other value = deleted by the user (MM no longer shows it, but its transactions still count)
      deleted:(+a.ZISDEL || 0) !== 0, hidden:false, order:a.ZORDER ?? 0,
      // MM: ZCARD_DAYFIN = first day of the new period (cut is the day before, 23:59), ZCARD_DAYPAY = due day
      statementDay:type === 'card' ? mmCutDay(a.ZCARD_DAYFIN) : null, dueDay:type === 'card' ? (parseInt(a.ZCARD_DAYPAY, 10) || null) : null};

  });
  const accIds = new Set(accounts.map(a => a.id));
  for (const a of accounts) if (a.parentId && !accIds.has(a.parentId)) a.parentId = null;
  const txRows = rows(`select ZUID, ZDO_TYPE, ZAMOUNT, ZASSETUID, ZTOASSETUID, ZCATEGORYUID, ZTXDATESTR, ZDATE, ZCONTENT, ZMEMO from ZINOUTCOME where ${active} and ZDO_TYPE in ('0','1','3','7','8')`);
  const usedCats = new Set(txRows.map(t => String(t.ZCATEGORYUID)));
  let ci = 0;
  const cats = rows('select ZUID, ZNAME, ZPUID, ZDOTYPE, ZISDEL, ZORDER from ZCATEGORY').filter(c => c.ZISDEL !== 1 || usedCats.has(String(c.ZUID)) ).map(c => ({
    id:'mm-' + c.ZUID, name:String(c.ZNAME || '').trim(), kind:String(c.ZDOTYPE) === '0' ? 'income' : 'expense',
    parentId:c.ZPUID && c.ZPUID !== '0' ? 'mm-' + c.ZPUID : null, emoji:guessEmoji(c.ZNAME), hidden:c.ZISDEL === 1, order:c.ZORDER ?? ci++, color:null
  }));
  const catIds = new Set(cats.map(c => c.id));
  for (const c of cats) if (c.parentId && !catIds.has(c.parentId)) c.parentId = null;
  // children hidden only matters for picker; color top-level categories from palette in order
  for (const kind of ['expense', 'income']) cats.filter(c => !c.parentId && c.kind === kind && !c.hidden).sort((a, b) => a.order - b.order).forEach((c, i) => c.color = CAT_COLORS[i % CAT_COLORS.length]);
  for (const c of cats) if (!c.parentId && !c.color) c.color = '#94A3B8';
  for (const c of cats) if (!c.color) c.color = cats.find(p => p.id === c.parentId)?.color || '#64748B';
  const txs = [];
  for (const r of txRows) {
    const accId = 'mm-' + r.ZASSETUID; if (!accIds.has(accId)) continue;
    const ty = String(r.ZDO_TYPE), amt = Math.round(Math.abs(+r.ZAMOUNT || 0) * 100) / 100;
    const ts = r.ZDATE ? Math.round((+r.ZDATE + CORE_DATA_EPOCH) * 1000) : 0;
    let date = r.ZTXDATESTR; if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) { const d = new Date(ts); date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    const base = {id:'mm-' + r.ZUID, amount:amt, accountId:accId, toAccountId:null, categoryId:null, date, ts, note:String(r.ZCONTENT || '').trim(), memo:String(r.ZMEMO || '').trim()};
    // income/expense keep their sign: a negative expense is a refund (iade)
    if (ty === '0' || ty === '1') { base.type = ty === '0' ? 'income' : 'expense'; base.amount = Math.round((+r.ZAMOUNT || 0) * 100) / 100; const cid = 'mm-' + r.ZCATEGORYUID; base.categoryId = catIds.has(cid) ? cid : null; }
    else if (ty === '3') { const to = 'mm-' + r.ZTOASSETUID; if (!accIds.has(to)) continue; base.type = 'transfer'; base.toAccountId = to; }
    else { base.type = 'adjust'; base.amount = ty === '7' ? amt : -amt; if (base.note === 'Bakiye Farkı') base.note = ''; }
    txs.push(base);
  }
  db.close();
  return {version:1, accounts, categories:cats, txs, meta:{importedAt:Date.now(), source:file.name, cutDayFix:true}};
}
$('#file-mm').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (S.txs.length && !confirm(`Mevcut hesaplar, kategoriler ve işlemler (${S.txs.length}) Money Manager yedeğiyle değiştirilecek. Tekrarlayan işlem tanımların ve onlardan oluşan kayıtlar korunur. Devam edilsin mi?`)) return;
  $('#loading').classList.add('on');
  try {
    const data = await importMM(f);
    // keep recurring rules (and what they generated) whose accounts still exist in the backup
    const ids = new Set(data.accounts.map(a => a.id));
    const rules = (S.rules || []).filter(r => ids.has(r.accountId) && (!r.toAccountId || ids.has(r.toAccountId)));
    const keep = new Set(rules.map(r => r.id));
    data.txs.push(...S.txs.filter(t => keep.has(t.recurringId)));
    const loans = (S.loans || []).filter(l => ids.has(l.accountId) && ids.has(l.payFrom || l.accountId)), keepL = new Set(loans.map(l => l.id));
    data.txs.push(...S.txs.filter(t => keepL.has(t.loanId) && !keep.has(t.recurringId)));
    // categories made in Cüzdan; unused starter categories ("Sıfırdan başla") are dropped
    const usedCat = new Set([...data.txs, ...rules].map(x => x.categoryId));
    data.categories.push(...S.categories.filter(c => !String(c.id).startsWith('mm-') && (!String(c.id).startsWith('def-') || usedCat.has(c.id) || S.categories.some(k => k.parentId === c.id && usedCat.has(k.id)))));
    // keep icons the user chose: category defaults and per-transaction overrides (ids are stable across imports)
    const oldCat = new Map(S.categories.map(c => [c.id, c.emoji])), oldTx = new Map(S.txs.filter(t => t.icon).map(t => [t.id, t.icon]));
    const oldAcc = new Map(S.accounts.filter(a => a.icon).map(a => [a.id, a.icon]));
    for (const a of data.accounts) if (oldAcc.get(a.id)) a.icon = oldAcc.get(a.id);
    for (const c of data.categories) if (oldCat.get(c.id)) c.emoji = oldCat.get(c.id);
    const oldLink = new Map(S.categories.filter(c => 'link' in c).map(c => [c.id, c.link]));
    for (const c of data.categories) if (oldLink.has(c.id)) c.link = oldLink.get(c.id);
    for (const t of data.txs) if (oldTx.get(t.id)) t.icon = oldTx.get(t.id);
    S = {...emptyState(), ...data, rules, loans, icons:S.icons || {}, noteIcons:S.noteIcons || {}, budgets:S.budgets || {}, meta:{...S.meta, ...data.meta}};
    ensureLinks(); S.meta.linksV1 = true;
    await DB.set('state', S);
    ui.tab = 'home'; ui.month = curMonth(); render();
    toast(`${data.accounts.length} hesap, ${data.categories.length} kategori, ${data.txs.length.toLocaleString('tr-TR')} işlem aktarıldı`);
  } catch (err) { console.error(err); toast('Aktarılamadı: ' + err.message); }
  finally { $('#loading').classList.remove('on'); }
});

try { history.scrollRestoration = 'manual'; } catch {} // goBack restores the scroll position itself
window.addEventListener('popstate', () => { if (sheetState) closeSheet(); goBack(); });

/* ---------- boot ---------- */
(async () => {
  try { const st = await DB.get('state'); if (st) S = {...emptyState(), ...st}; } catch (e) { toast('Veritabanı açılamadı'); }
  // one-time fix: the first release stored Money Manager's "new period starts" day as the cut day
  if (!S.meta.cutDayFix) {
    for (const a of S.accounts) if (a.type === 'card' && a.statementDay && String(a.id).startsWith('mm-')) a.statementDay = mmCutDay(a.statementDay);
    S.meta.cutDayFix = true; if (S.accounts.length) save();
  }
  if (!S.meta.linksV1 && S.categories.length) { ensureLinks(); S.meta.linksV1 = true; save(); }
  if (!S.meta.linksV2 && S.categories.length) { ensureLinks(); S.meta.linksV2 = true; save(); } // merge duplicate Kredi/Yatırım/Borç
  ui.month = curMonth();
  const n = runRecurring(), nl = runLoans();
  render();
  if (n) toast(`${n} tekrarlayan işlem eklendi`);
  if (nl) toast(`${nl} kredi taksiti otomatik ödendi`);
  // a PWA can stay open for days: re-check due items whenever it comes back to the foreground
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || sheetState) return;
    const k = runRecurring() + runLoans();
    if (k || D?.today !== todayStr()) render();
    if (k) toast(`${k} tekrarlayan işlem eklendi`);
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (S.accounts.length) storageStatus().then(st => { if (st.supported && !st.persisted) askPersist(); });
})();
</script>
